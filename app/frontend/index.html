<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Document Gateway</title>
  <link rel="stylesheet" href="/tokens.css">
  <style>
    /* Inline overrides and layout-specific CSS */
    .content{overflow-y:auto}
    .details-summary{margin-bottom:18px;padding:0}
    .toast{position:fixed;bottom:20px;right:20px;background:#fff;border:1px solid var(--line);border-radius:12px;padding:14px 18px;box-shadow:var(--shadow-lg);z-index:50;animation:slideIn .3s}
    @keyframes slideIn{from{transform:translateY(100px);opacity:0}to{transform:translateY(0);opacity:1}}
    .error-banner{background:#fee2e2;border:1px solid #fecaca;border-radius:12px;padding:12px 16px;color:#991b1b;margin-bottom:16px}
    .loading-overlay{position:absolute;inset:0;background:rgba(255,255,255,.7);display:flex;align-items:center;justify-content:center;z-index:10}
    .reconciliation-table{width:100%;font-size:13px;border-collapse:collapse}
    .reconciliation-table th{background:#f8fafc;padding:9px 12px;text-align:left;font-weight:700;font-size:10.5px;text-transform:uppercase;letter-spacing:.07em;color:var(--mut);border-bottom:1px solid var(--line)}
    .reconciliation-table td{padding:9px 12px;border-bottom:1px solid var(--line)}
    .reconciliation-table input{padding:6px;border:1px solid var(--line2);border-radius:6px;font:13px system-ui;width:100%}
    .lineage-chain{display:flex;gap:12px;align-items:stretch;margin-top:12px;flex-wrap:wrap}
    .lineage-node{background:#f8fafc;border:1px solid var(--line2);border-radius:8px;padding:12px;flex:0 1 auto;min-width:140px}
    .lineage-node .type{font-size:10px;color:var(--mut);font-weight:700;text-transform:uppercase;letter-spacing:.06em}
    .lineage-node .content{font-size:13px;font-weight:600;color:var(--ink);margin-top:4px}
    .lineage-arrow{color:var(--mut2);font-weight:700;align-self:center}
    .completeness-flag{display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:600}
    .pill{display:inline-block;padding:6px 11px;border-radius:20px;background:var(--amber-bg);color:var(--amber-ink);font-size:11px;font-weight:700}
    .pill.live{background:#f0f9ff;color:#0369a1}
    .pill.cached{background:#fef3c7;color:#92400e}
    @media(max-width:820px){
      .main{padding:16px 20px}
      .tiles{grid-template-columns:1fr}
    }
  </style>
</head>
<body>
  <div class="app">
    <aside class="sidebar">
      <div class="brand">
        <div class="brickmark">
          <i></i><i></i><i></i><i></i>
        </div>
        <div>
          <div class="bt">Bricksurance</div>
          <div class="bs">Document Gateway</div>
        </div>
      </div>
      <nav class="nav" id="nav"></nav>
      <div class="side-foot">
        <div style="font-size:11px;font-weight:700;color:#cbd5e1;margin-bottom:8px">MODE</div>
        <button class="pill live" id="modeBtn" style="width:100%;text-align:center;border:none;cursor:pointer;font-weight:700">LIVE</button>
      </div>
    </aside>
    <main class="main">
      <div class="content" id="app"></div>
    </main>
  </div>

  <div class="modal" id="confirmModal">
    <div class="box">
      <h3 style="margin:0 0 12px">Confirm</h3>
      <p id="confirmText" style="margin:0 0 12px;font-size:13px;color:var(--slate)"></p>
      <label for="confirmReason">Reason (optional):</label>
      <textarea id="confirmReason" style="min-height:60px"></textarea>
      <div style="display:flex;gap:10px;margin-top:16px">
        <button class="act" id="confirmBtn" style="flex:1">Confirm</button>
        <button class="ghost" id="cancelBtn" style="flex:1">Cancel</button>
      </div>
    </div>
  </div>

  <script>
    // Global state
    let MODE = 'cached';
    let error = null;
    let toasts = [];
    // Three document flows. Each scopes the nav to its own screens so a user of one
    // flow never sees another's jargon (MRC people don't see bordereaux, etc.).
    const FLOWS = {
      mrc: {label:'Market Reform Contract', short:'MRC', icon:'📜', sub:'Lloyd\'s MRC v3 · open market',
        views:[
          {id:'mrc_inbox', label:'Inbox', icon:'📥'},
          {id:'mrc_recognition', label:'Schema Recognition', icon:'🧬'},
          {id:'mrc_schemas', label:'Schema Repository', icon:'🗄️'},
          {id:'mrc_certainty', label:'Contract Certainty', icon:'✅'},
          {id:'mrc_cdr', label:'Core Data Record', icon:'🧾'},
          {id:'mrc_lineage', label:'Lineage', icon:'🔗'},
          {id:'mrc_metrics', label:'Metrics', icon:'📈'},
          {id:'mrc', label:'Contracts & Ask', icon:'💬'},
          {id:'mrc_semantics', label:'ACORD Semantics', icon:'🔤'},
          {id:'mrc_audit', label:'Audit', icon:'🔍'},
          {id:'learn', label:'Learn', icon:'ℹ️'}
        ]},
      bordereaux: {label:'Bordereaux', short:'Bordereaux', icon:'📊', sub:'Delegated authority · premium & claims',
        views:[
          {id:'inbox', label:'Inbox', icon:'📥'},
          {id:'quarantine', label:'Quarantine & Remap', icon:'⚠️'},
          {id:'schema', label:'Schema Recognition', icon:'🧬'},
          {id:'book', label:'The Book', icon:'📖'},
          {id:'lineage', label:'Lineage', icon:'🔗'},
          {id:'templates', label:'Templates', icon:'📋'},
          {id:'audit', label:'Audit', icon:'🔍'},
          {id:'eval', label:'Eval', icon:'✓'},
          {id:'ask', label:'Ask', icon:'💬'},
          {id:'learn', label:'Learn', icon:'ℹ️'}
        ]},
      health_slip: {label:'Health renewal slip', short:'Renewal slip', icon:'🏥', sub:'Config-port',
        views:[
          {id:'config-port', label:'Config-port', icon:'🧩'},
          {id:'learn', label:'Learn', icon:'ℹ️'}
        ]}
    };
    const FLOW_ORDER = ['mrc','bordereaux','health_slip'];
    function flowForView(id){ for(const f of FLOW_ORDER){ if(FLOWS[f].views.some(v=>v.id===id)) return f; } return null; }

    // Fetch helper with loading state
    async function fetchJSON(path, opts = {}) {
      const spinId = 'spin_' + Math.random().toString(36).slice(2);
      const container = document.querySelector('.content');
      const spin = document.createElement('span');
      spin.className = 'spin';
      spin.id = spinId;
      if(container && opts.showSpinner !== false) {
        const existing = container.querySelector('.spin');
        if(!existing) container.appendChild(spin);
      }
      try {
        const url = new URL(path, window.location.origin);
        if(opts.method === 'POST' || opts.method === 'PUT') {
          url.searchParams.set('mode', MODE);
        }
        const response = await fetch(url.toString(), {
          method: opts.method || 'GET',
          headers: {'Content-Type': 'application/json', ...opts.headers},
          body: opts.body ? JSON.stringify(opts.body) : undefined
        });
        if(!response.ok) throw new Error(`HTTP ${response.status}`);
        const data = await response.json();
        spin.remove();
        error = null;
        return data;
      } catch(e) {
        spin.remove();
        error = e.message;
        throw e;
      }
    }

    // Toast notification
    function toast(msg, duration = 3000) {
      const el = document.createElement('div');
      el.className = 'toast';
      el.textContent = msg;
      document.body.appendChild(el);
      setTimeout(() => el.remove(), duration);
    }

    // Modal confirm
    async function confirm(text) {
      return new Promise((resolve) => {
        const modal = document.getElementById('confirmModal');
        const confirmText = document.getElementById('confirmText');
        const confirmReason = document.getElementById('confirmReason');
        const confirmBtn = document.getElementById('confirmBtn');
        const cancelBtn = document.getElementById('cancelBtn');

        confirmText.textContent = text;
        confirmReason.value = '';
        modal.style.display = 'flex';

        const cleanup = () => {
          modal.style.display = 'none';
          confirmBtn.removeEventListener('click', onConfirm);
          cancelBtn.removeEventListener('click', onCancel);
        };

        const onConfirm = () => {
          cleanup();
          resolve({confirmed: true, reason: confirmReason.value});
        };
        const onCancel = () => {
          cleanup();
          resolve({confirmed: false, reason: ''});
        };

        confirmBtn.addEventListener('click', onConfirm);
        cancelBtn.addEventListener('click', onCancel);
      });
    }

    // Format money
    function formatMoney(num, currency = 'GBP') {
      if(num == null) return '—';
      const sign = num < 0 ? '−' : '';
      const abs = Math.abs(num);
      const formatted = new Intl.NumberFormat('en-GB', {
        minimumFractionDigits: 0,
        maximumFractionDigits: 0
      }).format(abs);
      const sym = currency === 'EUR' ? '€' : currency === 'USD' ? '$' : '£';
      return sign + sym + formatted;
    }

    // Render views
    const views = {
      'home': async function() {
        const cards = FLOW_ORDER.map(function(f, i){
          const fl = FLOWS[f]; const first = fl.views[0].id;
          return `<a href="#${first}" style="display:flex;align-items:center;gap:16px;padding:20px;background:var(--card);border:1px solid var(--line);border-radius:14px;box-shadow:var(--shadow);text-decoration:none;color:inherit">
            <div style="font-size:34px;line-height:1">${fl.icon}</div>
            <div><div style="font-size:16px;font-weight:800;color:var(--ink)">${i+1}. ${escapeHtml(fl.label)}</div>
            <div style="font-size:12px;color:var(--mut);margin-top:2px">${escapeHtml(fl.sub)}</div></div>
          </a>`;
        }).join('');
        return `
          <details class="details-summary" open><summary>What am I seeing?</summary>
            <div class="body">Pick a document flow. Each is the same governed loop — recognise a document's data points, record its schema once, then let matching files flow straight through — applied to a different counterparty document. Start with Market Reform Contracts.</div>
          </details>
          <h1 style="margin:6px 0 4px">Document Gateway</h1>
          <div style="color:var(--mut);margin-bottom:22px">One governed loop, three document flows — choose where to start.</div>
          <div style="display:grid;grid-template-columns:1fr;gap:14px;max-width:640px">${cards}</div>`;
      },

      'mrc_inbox': async function() {
        const d = await fetchJSON('/api/mrc/inbox');
        const c = d.state_counts || {};
        const META = {
          awaiting_recognition: ['differs', 'Awaiting recognition'],
          processing: ['plain', 'Processing…'],
          recognised: ['active', 'Recognised → ingested'],
          unrecognised: ['quarantined', 'Needs review (HITL)'],
          rejected: ['plain', 'Rejected — not an MRC'],
          returned_to_broker: ['plain', 'Returned to broker']
        };
        const m = s => META[s] || ['plain', s];
        const job = d.job || {};
        const resetting = job.running && job.kind === 'reset';
        const busy = (c.processing || 0) > 0 || job.running;
        const act = x => x.inbound_state === 'unrecognised'
          ? `<button class="ghost" data-mrc-review="reject" data-doc="${escapeAttr(x.doc_id)}">Reject — not an MRC</button>
             <button class="ghost" data-mrc-review="return" data-doc="${escapeAttr(x.doc_id)}">Return to broker</button>` : '';
        return `
          <details class="details-summary" open><summary>What am I seeing?</summary>
            <div class="body">Every document that has arrived and where it is in the loop. A contract that matches the recorded schema is recognised and ingested automatically. Anything that doesn't match is held for a person to decide — it never lands on its own.</div>
          </details>
          ${!d.schema_registered ? '<div class="banner">No MRC schema recorded yet — open <b>Schema Recognition</b> to confirm the first contract. After that, matching contracts flow straight through.</div>' : ''}
          ${resetting ? '<div class="banner"><span class="spin"></span> Resetting the demo to its starting point — about a minute. The documents reappear as they are re-staged.</div>'
            : (busy ? '<div class="banner"><span class="spin"></span> Processing contracts against the recorded schema — they appear as recognised one by one.</div>' : '')}
          <div class="tiles">
            <div class="tile"><div class="k">Awaiting recognition</div><div class="v warn">${(c.awaiting_recognition || 0) + (c.processing || 0)}</div></div>
            <div class="tile"><div class="k">Recognised</div><div class="v pos">${c.recognised || 0}</div></div>
            <div class="tile"><div class="k">Needs review</div><div class="v neg">${c.unrecognised || 0}</div></div>
            <div class="tile"><div class="k">Resolved by a person</div><div class="v">${(c.rejected || 0) + (c.returned_to_broker || 0)}</div></div>
            <div class="tile"><div class="k">Total</div><div class="v">${d.documents.length}</div></div>
          </div>
          <div id="mrcPdfViewer"></div>
          <div class="card"><div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:6px">
            <h2 style="margin:0">Documents</h2>
            <button class="ghost" id="mrcResetBtn" ${busy ? 'disabled' : ''} title="Return this flow to the demo starting point">↺ Reset demo</button></div>
            <table><thead><tr><th>File</th><th>Broker</th><th>State</th><th></th></tr></thead>
            <tbody>${d.documents.map(x => `<tr>
              <td style="font-weight:600">${escapeHtml(x.file_name)}</td>
              <td>${escapeHtml(x.counterparty || '—')}</td>
              <td><span class="chip ${m(x.inbound_state)[0]}">${escapeHtml(m(x.inbound_state)[1])}</span></td>
              <td style="white-space:nowrap"><button class="ghost" data-mrc-view="${escapeAttr(x.doc_id)}" data-name="${escapeAttr(x.file_name)}">View</button> ${act(x)}</td></tr>`).join('')}</tbody></table></div>
          <script>
            document.querySelectorAll('[data-mrc-review]').forEach(function(b){
              b.addEventListener('click', async function(){
                var action = b.getAttribute('data-mrc-review');
                var c = await confirm(action === 'reject' ? 'Reject this document? It is not a Market Reform Contract.' : 'Return this document to the broker for a full MRC?');
                if(!c.confirmed){ return; }
                try{
                  await fetchJSON('/api/mrc/review',{method:'POST',body:{doc_id:b.getAttribute('data-doc'),action:action,reason:c.reason}});
                  toast(action === 'reject' ? 'Rejected — decision recorded' : 'Returned to broker — decision recorded');
                  render();
                }catch(e){ toast('Error: '+e.message); }
              });
            });
            document.querySelectorAll('[data-mrc-view]').forEach(function(b){
              b.addEventListener('click', function(){
                var id = b.getAttribute('data-mrc-view');
                var url = '/api/mrc/pdf/' + encodeURIComponent(id);
                var box = document.getElementById('mrcPdfViewer');
                box.innerHTML = '<div class="card"><div style="display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:10px">'
                  + '<h2 style="margin:0">' + escapeHtml(b.getAttribute('data-name')) + '</h2>'
                  + '<div style="display:flex;gap:8px"><a class="ghost" style="text-decoration:none;padding:7px 12px;border-radius:8px" href="' + url + '" target="_blank" rel="noopener">Open in new tab ↗</a>'
                  + '<button class="ghost" id="mrcPdfClose">Close</button></div></div>'
                  + '<iframe src="' + url + '" title="PDF preview" style="width:100%;height:720px;border:1px solid var(--line);border-radius:8px;background:#fff"></iframe></div>';
                document.getElementById('mrcPdfClose').addEventListener('click', function(){ box.innerHTML = ''; });
                box.scrollIntoView({behavior:'smooth', block:'start'});
              });
            });
            document.getElementById('mrcResetBtn').addEventListener('click', async function(){
              var c = await confirm('Reset the MRC demo to its starting point? This clears the recorded schema, the processed contracts, their checks, the decisions and the audit trail for this flow, then re-stages the five contracts and the cover note. It takes about a minute.');
              if(!c.confirmed){ return; }
              try{
                await fetchJSON('/api/mrc/reset',{method:'POST',body:{}});
                toast('Resetting the demo…');
                setTimeout(function(){ render(); }, 1500);
              }catch(e){ toast('Could not reset: '+e.message); }
            });
            if (${busy ? 'true' : 'false'}) {
              setTimeout(function(){ if((window.location.hash||'').indexOf('#mrc_inbox')===0){ render(); } }, 2500);
            }
          <\/script>`;
      },

      'mrc_recognition': async function() {
        const p = await fetchJSON('/api/mrc/propose');
        if (!p.doc_id) {
          return `<details class="details-summary" open><summary>What am I seeing?</summary>
            <div class="body">The recognition step for the next unrecognised MRC.</div></details>
            <div class="card">No documents awaiting recognition — every conforming contract has been recognised. See <a href="#mrc">Contracts &amp; Ask</a>.</div>`;
        }
        const rows = p.points.map(pt => `<tr>
          <td style="font-weight:600">${escapeHtml(pt.label)}${pt.core ? ' <span class="chip plain">core</span>' : ''}</td>
          <td><code>${escapeHtml(pt.acord)}</code></td>
          <td>${pt.cdr ? escapeHtml(pt.cdr) : '<span style="color:var(--mut)">— (wording only)</span>'}</td>
          <td>${escapeHtml(pt.section)}</td>
          <td><span class="chip ${pt.status === 'identified' ? 'active' : 'quarantined'}">${pt.status === 'identified' ? 'identified' : 'not found'}</span></td>
          <td>${escapeHtml(pt.value || '—')}${pt.source_quote ? `<div style="font-size:11px;color:var(--mut);margin-top:3px">“${escapeHtml(pt.source_quote)}”</div>` : ''}</td></tr>`).join('');
        return `
          <details class="details-summary" open><summary>What am I seeing?</summary>
            <div class="body">These are the ACORD data points we expect from an MRC. Extraction identifies all or some of them. When you confirm, the schema is recorded in the repository — and every matching contract after this flows straight through.</div>
          </details>
          <div class="strip">
            <div><div class="lbl">Document</div><div class="big brand" style="font-size:19px">${escapeHtml(p.file_name)}</div></div>
            <div><div class="lbl">Core data points identified</div><div class="big">${p.core_found}/${p.core_total}</div></div>
            <div><div class="lbl">Conforms to MRC structure</div><div class="big ${p.conforming ? 'pos' : 'neg'}">${p.conforming ? 'Yes' : 'No'}</div></div>
          </div>
          <div class="card"><h2 style="margin-top:0">Expected ACORD data points</h2>
            <table><thead><tr><th>Data point</th><th>ACORD term</th><th>CDR field*</th><th>MRC section</th><th>Status</th><th style="min-width:240px">Value · source line</th></tr></thead>
            <tbody>${rows}</tbody></table>
            <div style="font-size:11px;color:var(--mut);margin-top:8px">* Indicative Lloyd's Core Data Record field — a paraphrased crosswalk for discussion, not the published specification. Values are read by MRC section and field label; the source line is shown for each.</div>
            <div style="margin-top:16px;display:flex;align-items:center;gap:12px">
              <button class="act" id="mrcConfirmBtn">Confirm &amp; register schema</button>
              <span style="color:var(--mut);font-size:12px">Records "Lloyd's MRC (ACORD)" in the schema repository; the other contracts are then recognised and ingested automatically — watch them flip in the Inbox.</span>
            </div>
          </div>
          <script>
            document.getElementById('mrcConfirmBtn')?.addEventListener('click', async function(){
              var b=this; b.disabled=true; b.textContent='Recording schema…';
              try{
                var r=await fetch('/api/mrc/confirm?mode='+MODE,{method:'POST',headers:{'Content-Type':'application/json'},body:'{}'});
                var d=await r.json(); if(!r.ok) throw new Error('HTTP '+r.status);
                toast('Schema recorded — matching contracts are now flowing through');
                setTimeout(function(){ window.location.hash='#mrc_inbox'; },900);
              }catch(e){ toast('Error: '+e.message); b.disabled=false; b.textContent='Confirm & register schema'; }
            });
          <\/script>`;
      },

      'mrc_schemas': async function() {
        const d = await fetchJSON('/api/mrc/schemas');
        if (!d.schemas.length) {
          return `<details class="details-summary" open><summary>What am I seeing?</summary>
            <div class="body">The schema repository — recognised MRC schemas are recorded here.</div></details>
            <div class="card">No schema registered yet — confirm one in <a href="#mrc_recognition">Schema Recognition</a>.</div>`;
        }
        return `<details class="details-summary" open><summary>What am I seeing?</summary>
            <div class="body">The schema repository. Once an MRC schema is recorded here, every new contract matching it is recognised and flows straight through — no re-mapping.</div></details>` +
          d.schemas.map(function(s){
            var pts = Object.keys(JSON.parse(s.field_map || '{}'));
            return `<div class="card"><h2 style="margin-top:0">${escapeHtml(s.counterparty)} <span class="chip active">${escapeHtml(s.template_version)}</span></h2>
              <div style="color:var(--mut);margin-bottom:10px">Recorded by ${escapeHtml(s.created_by)} · ${new Date(s.created_at).toLocaleString()} · ${s.field_count} data points</div>
              <div>${pts.map(k => `<span class="chip plain" style="margin:2px">${escapeHtml(k)}</span>`).join('')}</div></div>`;
          }).join('');
      },

      'mrc_semantics': async function() {
        const d = await fetchJSON('/api/mrc/semantics');
        const rows = d.data_points.map(x => `<tr>
          <td style="font-weight:600">${escapeHtml(x.data_point)}</td>
          <td><code>${escapeHtml(x.entity)}.${escapeHtml(x.attribute)}</code></td>
          <td>${x.core ? '<span class="chip plain">core</span>' : ''}</td>
          <td><span class="chip ${x.recognised ? 'active' : 'differs'}">${x.recognised ? 'recognised' : 'not yet'}</span></td>
          <td class="num">${x.instances}</td></tr>`).join('');
        return `
          <details class="details-summary" open><summary>What am I seeing?</summary>
            <div class="body">The ACORD semantics this process uses: every expected data point, the ACORD entity and attribute it binds to, and in how many of the landed contracts we recognised it.</div>
          </details>
          <div class="strip">
            <div><div class="lbl">ACORD coverage</div><div class="big brand">${d.coverage_pct}%</div></div>
            <div><div class="lbl">Recognised</div><div class="big">${d.recognised}/${d.required}</div></div>
          </div>
          <div class="card"><h2 style="margin-top:0">Required vs recognised (ACORD)</h2>
            <table><thead><tr><th>Data point</th><th>ACORD binding</th><th></th><th>Status</th><th class="num">Contracts</th></tr></thead>
            <tbody>${rows}</tbody></table></div>`;
      },

      'config-port': async function() {
        const d = await fetchJSON('/api/tenant_config?tenant=health_slip');
        return `
          <details class="details-summary" open><summary>What am I seeing?</summary>
            <div class="body">The health renewal-slip is a whole new document family — yet onboarding it added <strong>no new pipeline code</strong>. Everything below (its fields, the carrier's column labels, and how each maps into a governed table) is declared in <strong>one config file</strong>. The same engine that trusts, extracts, reconciles and lands bordereaux handles it. This is the "the entire ingestion front-end is now one config file" proof.</div>
          </details>
          <div class="banner">Onboarding the health renewal-slip family = this one file (<code>${escapeHtml(d.path)}</code>, ${d.lines} lines). No new pipeline code.</div>
          <div class="card">
            <pre style="background:#f8fafc;padding:16px;border-radius:8px;overflow-x:auto;font:12px ui-monospace,Menlo,monospace;margin:0;color:var(--slate2);line-height:1.5">${escapeHtml(d.config)}</pre>
          </div>`;
      },
      'eval': async function() {
        const data = await fetchJSON('/api/eval');
        const overall = data.overall || [];
        const fields = data.fields || [];
        if (!data.run_id) {
          return `<details class="details-summary" open><summary>What am I seeing?</summary>
            <div class="body">Accuracy of the AI extraction path, scored against synthetic ground truth.</div></details>
            <div class="card">No eval run yet — run <code>eval/run_eval.py</code>.</div>`;
        }
        const models = [...new Set(fields.map(f => f.model))];
        const fieldNames = [...new Set(fields.map(f => f.field))];
        const cell = (fn, m) => {
          const r = fields.find(x => x.field === fn && x.model === m);
          if (!r) return '<td>—</td>';
          const pct = (r.accuracy * 100).toFixed(0) + '%';
          const cls = r.accuracy >= 1 ? 'active' : 'differs';
          return `<td><span class="chip ${cls}">${pct}</span></td>`;
        };
        return `
          <details class="details-summary" open><summary>What am I seeing?</summary>
            <div class="body">The AI extraction path maps each source column to a canonical dictionary field. Because we generate the documents, the true mapping is known — so we score it, per field and per model, including decoy columns the model must ignore. This is the answer to "doesn't the model just hallucinate?".</div>

          <div class="tiles">
            ${overall.map(o => `<div class="tile"><div class="k">${escapeHtml(o.model)}</div>

            <h2>Per-field mapping accuracy — model comparison</h2>
            <table><thead><tr><th>Field</th>${models.map(m => `<th>${escapeHtml(m)}</th>`).join('')}</tr></thead>
              <tbody>${fieldNames.map(fn => `<tr><td style="font-weight:600">${escapeHtml(fn)}</td>${models.map(m => cell(fn, m)).join('')}</tr>`).join('')}</tbody>

          </div>`;
      },
      'mrc_certainty': async function() {

        const contracts = Object.values(byC);

      'mrc_metrics': async function() {
        const d = await fetchJSON('/api/mrc/metrics');
        const contracts = d.contracts || [];
        const t = d.totals || {};
        const fmt = (x, ccy) => (x == null || x === '') ? '—' : formatMoney(Number(x), ccy || 'GBP');
        const explain = `
          <details class="details-summary" open>
            <summary>What am I seeing?</summary>
            <div class="body">The numeric metrics parsed from each contract's prose (premium and headline limit are parsed deterministically from the wording, which is kept as the source). Charts summarise the book; the table below lets you correct any value in place — every change is recorded as a governed, audited decision.</div>
          </details>`;
        if (!contracts.length) {
          return explain + `<div class="card">No contracts ingested yet — recognise the schema first in <a href="#mrc_recognition">Schema Recognition</a>, then contracts flow through and their metrics appear here.</div>`;
        }
        // Single-hue horizontal bars (dataviz: thin marks, rounded ends on the baseline, direct value labels, no legend for one series).
        const hbar = (items, title) => {
          const max = Math.max(1, ...items.map(i => Number(i.v) || 0));
          const rowH = 40, W = 720, labelW = 210, valW = 150, barMax = W - labelW - valW;
          const h = items.length * rowH + 12;
          const rows = items.map((it, i) => {
            const y = i * rowH + 10, len = Math.max(2, (Number(it.v) || 0) / max * barMax);
            return `<text x="0" y="${y + 21}" font-size="12.5" fill="var(--ink)">${escapeHtml(it.label)}</text>`
              + `<rect x="${labelW}" y="${y + 8}" width="${len}" height="18" rx="4" fill="var(--brand)"></rect>`
              + `<text x="${labelW + len + 8}" y="${y + 21}" font-size="12" fill="var(--mut)" font-variant-numeric="tabular-nums">${escapeHtml(it.vl)}</text>`;
          }).join('');
          return `<div class="card"><h2 style="margin-top:0">${escapeHtml(title)}</h2>`
            + `<svg viewBox="0 0 ${W} ${h}" width="100%" role="img" aria-label="${escapeHtml(title)}">${rows}</svg></div>`;
        };
        const ccys = [...new Set(contracts.map(c => c.premium_currency).filter(Boolean))];
        const premiumCharts = ccys.map(cc => hbar(contracts.filter(c => c.premium_currency === cc)
            .map(c => ({label: c.class_of_business, v: c.premium_amount, vl: fmt(c.premium_amount, cc)})), 'Premium by class — ' + cc)).join('');
        const byCcy = d.by_currency || [];
        const opt = (v, cur) => `<option ${cur === v ? 'selected' : ''}>${v}</option>`;
        const editRow = c => `
          <tr>
            <td><input data-mrc-edit data-mrc-id="${escapeAttr(c.mrc_id)}" data-field="class_of_business" aria-label="Class of business" value="${escapeAttr(c.class_of_business || '')}" style="width:100%;padding:5px;border:1px solid var(--line2);border-radius:5px"></td>
            <td><input data-mrc-edit data-mrc-id="${escapeAttr(c.mrc_id)}" data-field="insured_name" aria-label="Insured name" value="${escapeAttr(c.insured_name || '')}" style="width:100%;padding:5px;border:1px solid var(--line2);border-radius:5px"></td>
            <td><input data-mrc-edit data-mrc-id="${escapeAttr(c.mrc_id)}" data-field="broker_name" aria-label="Broker" value="${escapeAttr(c.broker_name || '')}" style="width:100%;padding:5px;border:1px solid var(--line2);border-radius:5px"></td>
            <td class="num"><input data-mrc-edit data-mrc-id="${escapeAttr(c.mrc_id)}" data-field="premium_amount" aria-label="Premium amount" value="${escapeAttr(c.premium_amount || '')}" style="width:120px;padding:5px;text-align:right;border:1px solid var(--line2);border-radius:5px"></td>
            <td><select data-mrc-edit data-mrc-id="${escapeAttr(c.mrc_id)}" data-field="premium_currency" aria-label="Currency" style="padding:5px;border:1px solid var(--line2);border-radius:5px">${['GBP','USD','EUR'].map(v => opt(v, c.premium_currency)).join('')}</select></td>
            <td class="num"><input data-mrc-edit data-mrc-id="${escapeAttr(c.mrc_id)}" data-field="limit_amount" aria-label="Limit amount" value="${escapeAttr(c.limit_amount || '')}" style="width:130px;padding:5px;text-align:right;border:1px solid var(--line2);border-radius:5px"></td>
          </tr>`;
        return explain
          + `<div class="tiles">
               <div class="tile"><div class="k">Contracts</div><div class="v">${t.contracts}</div></div>
               ${byCcy.map(b => `<div class="tile"><div class="k">Premium (${escapeHtml(b.currency)})</div><div class="v">${fmt(b.premium, b.currency)}</div><div class="k">${b.n} contract${b.n > 1 ? 's' : ''}</div></div>`).join('')}
               ${byCcy.map(b => `<div class="tile"><div class="k">Limits (${escapeHtml(b.currency)})</div><div class="v">${fmt(b.limit_amt, b.currency)}</div></div>`).join('')}
             </div>
             <div style="font-size:11px;color:var(--mut);margin:-6px 0 14px">Totals are kept per currency — GBP and USD are never added together.</div>`
          + `<div class="grid2">${premiumCharts}</div>`
          + `<div class="card">
               <h2 style="margin-top:0">Extracted metrics — edit in place</h2>
               <div style="font-size:12px;color:var(--mut);margin-bottom:10px">Correct any value and tab out; the change is saved to the projection and recorded as a governed, audited decision.</div>
               <table>
                 <thead><tr><th>Class</th><th>Insured</th><th>Broker</th><th class="num">Premium</th><th>Ccy</th><th class="num">Limit</th></tr></thead>
                 <tbody>${contracts.map(editRow).join('')}</tbody>
               </table>
             </div>
             <script>
               document.querySelectorAll('[data-mrc-edit]').forEach(function(inp){
                 inp.addEventListener('change', async function(){
                   try{
                     await fetchJSON('/api/mrc/update',{method:'POST',body:{mrc_id:inp.getAttribute('data-mrc-id'),field:inp.getAttribute('data-field'),value:inp.value}});
                     toast('Saved '+inp.getAttribute('data-field')+' — recorded & audited');
                     render();
                   }catch(e){ toast('Error: '+e.message); }
                 });
               });
             <\/script>`;
      },

          <details class="details-summary" open>
            <summary>What am I seeing?</summary>
            <div class="body">Ask questions about the book and let AI analyze the data. This surface connects to our governed analytics space, so every answer comes with lineage and auditability.</div>
          </details>
          <div class="card">
            <h2>Ask the Book</h2>
            <div style="display:flex;gap:10px;margin-top:12px">
              <input type="text" id="askInput" aria-label="Ask a question about the book" placeholder="Ask a question about the book..." style="flex:1;padding:9px;border:1px solid var(--line2);border-radius:8px">
              <button class="act" id="askBtn">Ask</button>
            </div>

            <h3 style="margin-top:16px">Example questions</h3>
            <div style="display:flex;flex-wrap:wrap;gap:8px;margin-top:8px">
              ${examples.map(ex => `
                <button class="chipq" data-example="${escapeAttr(ex)}">${escapeHtml(ex)}</button>
              `).join('')}
            </div>

            <div id="askResult" style="margin-top:18px"></div>
          </div>

          <script>
            document.querySelectorAll('[data-example]').forEach(btn => {
              btn.addEventListener('click', () => {
                document.getElementById('askInput').value = btn.dataset.example;
              });
            });

            document.getElementById('askBtn')?.addEventListener('click', async () => {
              const question = document.getElementById('askInput').value.trim();
              if(!question) {
                toast('Please enter a question');
                return;
              }

              try {
                const result = await fetchJSON('/api/ask', {method: 'POST', body: {question}});
                const {answer = '', sql = '', rows = []} = result;

                let html = '';
                if(answer) {
                  html += \`<div class="card"><h3 style="margin-top:0">Answer</h3><p style="margin:0;font-size:13px;line-height:1.6">\${escapeHtml(answer)}</p></div>\`;
                }
                if(sql) {
                  html += \`<div class="card"><h3 style="margin-top:0">Generated SQL</h3><pre style="background:#f8fafc;padding:12px;border-radius:8px;overflow-x:auto;font:12px ui-monospace,Menlo,monospace;margin:0;color:var(--slate2)">\${escapeHtml(sql)}</pre></div>\`;
                }
                if(rows && rows.length > 0) {
                  html += \`<div class="card"><table style="width:100%;font-size:13px;border-collapse:collapse">\`;
                  rows.forEach((row, i) => {
                    if(i === 0) {
                      html += \`<thead style="background:#f8fafc"><tr>\`;
                      row.forEach(cell => {
                        html += \`<th style="padding:9px 12px;text-align:left;font-weight:700;font-size:10.5px;text-transform:uppercase;letter-spacing:.07em;color:var(--mut);border-bottom:1px solid var(--line)">\${escapeHtml(String(cell))}</th>\`;
                      });
                      html += '</tr></thead><tbody>';
                    } else {
                      html += '<tr style="border-bottom:1px solid var(--line)">';
                      row.forEach(cell => {
                        html += \`<td style="padding:9px 12px">\${escapeHtml(String(cell))}</td>\`;
                      });
                      html += '</tr>';
                    }
                  });
                  html += '</tbody></table></div>';
                }

                document.getElementById('askResult').innerHTML = html || '<div class="mut">No response from API</div>';
              } catch(e) {
                if(e.message.includes('400')) {
                  document.getElementById('askResult').innerHTML = '<div class="banner" style="background:#fef3c7;border:1px solid #fde68a;color:#92400e">Ask-the-gateway is being provisioned. Check back in a few moments.</div>';
                } else {
                  toast('Error: ' + e.message);
                  document.getElementById('askResult').innerHTML = '';
                }
              }
            });
          <\/script>
        `;
      },

      async learn() {
        try {
          const data = await fetchJSON('/api/learn');
          const cards = data.cards || [];

          // Group by band
          const grouped = {};
          cards.forEach(c => {
            if(!grouped[c.band]) grouped[c.band] = [];
            grouped[c.band].push(c);
          });

          const bands = Object.keys(grouped);

          return `
            <details class="details-summary" open>
              <summary>What am I seeing?</summary>
              <div class="body">How the Document Gateway works: each step is a real workflow in the platform, linked to the tables and functions that power it. Click a step to see the underlying mechanism.</div>
            </details>
            ${bands.map(band => `
              <div class="card">
                <h2>${escapeHtml(band)}</h2>
                <div class="jflow">
                  ${grouped[band].map((card, i) => `
                    <div class="jgroup">
                      <div class="gl">${escapeHtml(card.activity)}</div>
                      <div style="font-size:13px;color:var(--ink);margin-bottom:8px">${escapeHtml(card.how)}</div>
                      ${card.links && card.links.length > 0 ? `
                        <div style="display:flex;flex-direction:column;gap:6px;margin-top:8px">
                          ${card.links.map(link => `
                            <a href="${escapeAttr(link.url)}" target="_blank" class="assetlink">
                              ${escapeHtml(link.label)} ${link.external ? '↗' : '→'}
                            </a>
                          `).join('')}
                        </div>
                      ` : ''}
                    </div>
                  `).join('')}
                </div>
              </div>
            `).join('')}
          `;
        } catch(e) {
          return `<div class="error-banner">Failed to load Learn: ${escapeHtml(e.message)}</div>`;
        }
      },

      async audit() {
        try {
          const data = await fetchJSON('/api/audit?limit=50');
          const events = data.events || [];

          return `
            <details class="details-summary" open>
              <summary>What am I seeing?</summary>
              <div class="body">A complete audit trail of all decisions made in the Document Gateway: who approved which mappings, when, and why. This is your governance record.</div>
            </details>
            <div class="card">
              <h2>Audit Trail</h2>
              <table>
                <thead><tr>
                  <th>Created</th><th>Event Type</th><th>Entity Type</th><th>Entity ID</th><th>Actor</th><th>Detail</th>
                </tr></thead>
                <tbody>
                  ${events.map(e => `
                    <tr style="border-bottom:1px solid var(--line)">
                      <td style="padding:9px 12px;font-size:13px">${new Date(e.created_at).toLocaleString()}</td>
                      <td style="padding:9px 12px"><span class="chip ${e.event_type}">${e.event_type}</span></td>
                      <td style="padding:9px 12px;font-size:13px">${escapeHtml(e.entity_type)}</td>
                      <td style="padding:9px 12px;font-size:13px;font-weight:600">${escapeHtml(e.entity_id)}</td>
                      <td style="padding:9px 12px;font-size:13px">${escapeHtml(e.actor)}</td>
                      <td style="padding:9px 12px;font-size:13px;color:var(--mut)">${escapeHtml(e.detail || '—')}</td>
                    </tr>
                  `).join('')}
                </tbody>
              </table>
            </div>
          `;
        } catch(e) {
          return `<div class="error-banner">Failed to load audit: ${escapeHtml(e.message)}</div>`;
        }
      }
    };

    // Render nav
    function renderNav() {
      const hash = (window.location.hash || '#home').slice(1).split('?')[0];
      const nav = document.getElementById('nav');
      const flow = flowForView(hash);
      if (!flow) {  // landing — no scoped nav
        nav.innerHTML = '';
        return;
      }
      const fl = FLOWS[flow];
      nav.innerHTML = `
        <a href="#home" class="nav-a" style="opacity:.8"><span class="ic">⌂</span><span>All flows</span></a>
        <div style="font-size:11px;font-weight:700;color:#94a3b8;text-transform:uppercase;letter-spacing:.08em;margin:14px 12px 6px">${escapeHtml(fl.short)}</div>
        ${fl.views.map(item => `
          <a href="#${item.id}" class="nav-a ${hash === item.id ? 'active' : ''}">
            <span class="ic">${item.icon}</span>
            <span>${item.label}</span>
          </a>
        `).join('')}
      `;
    }

    // Escape HTML
    function escapeHtml(str) {
      if(!str) return '';
      const div = document.createElement('div');
      div.textContent = str;
      return div.innerHTML;
    }

    function escapeAttr(str) {
      if(!str) return '';
      return str.replace(/&/g,'&amp;').replace(/"/g,'&quot;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
    }

    // Main render
    async function render() {
      renderNav();
      const hash = (window.location.hash || '#home').slice(1).split('?')[0];
      const viewFn = views[hash] || views.home;
      const app = document.getElementById('app');
      app.innerHTML = '<div style="position:relative"><span class="spin"></span></div>';
      try {
        const html = await viewFn();
        app.innerHTML = html;
        // Scripts injected via innerHTML do not execute — re-create them so view
        // event handlers actually run.
        app.querySelectorAll('script').forEach(old => {
          const s = document.createElement('script');
          s.textContent = old.textContent;
          old.replaceWith(s);
        });
      } catch(e) {
        app.innerHTML = `<div class="error-banner">Error loading view: ${escapeHtml(e.message)}</div>`;
      }
    }

    // Mode toggle
    document.getElementById('modeBtn')?.addEventListener('click', () => {
      MODE = MODE === 'cached' ? 'live' : 'cached';
      const btn = document.getElementById('modeBtn');
      btn.className = 'pill ' + MODE;
      btn.textContent = MODE.toUpperCase();
    });

    // Router
    window.addEventListener('hashchange', render);
    render();

    // Footer disclaimer
    const footer = document.createElement('footer');
    footer.style.cssText = 'padding:32px;text-align:center;font-size:11px;color:var(--mut);border-top:1px solid var(--line);margin-top:60px';
    footer.innerHTML = `<strong>About this demo.</strong> Bricksurance is a fictional insurance group and all coverholders, carriers and figures here are synthetic. The MRC tenant uses real, publicly-known market names for realism, but all insureds and figures are invented. The method is illustrative. Every screen reads a real governed Unity Catalog table, view, or function.`;
    document.querySelector('.content')?.parentElement?.appendChild(footer);
  </script>
</body>
</html>
