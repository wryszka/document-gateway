<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Document Gateway</title>
  <link rel="stylesheet" href="/tokens.css">
  <style>
    /* Inline overrides and layout-specific CSS */
    .content{overflow-y:auto}
    .details-summary{margin-bottom:18px;padding:0}
    .toast{position:fixed;bottom:20px;right:20px;background:#fff;border:1px solid var(--line);border-radius:12px;padding:14px 18px;box-shadow:var(--shadow-lg);z-index:50;animation:slideIn .3s}
    @keyframes slideIn{from{transform:translateY(100px);opacity:0}to{transform:translateY(0);opacity:1}}
    .error-banner{background:#fee2e2;border:1px solid #fecaca;border-radius:12px;padding:12px 16px;color:#991b1b;margin-bottom:16px}
    .loading-overlay{position:absolute;inset:0;background:rgba(255,255,255,.7);display:flex;align-items:center;justify-content:center;z-index:10}
    .reconciliation-table{width:100%;font-size:13px;border-collapse:collapse}
    .reconciliation-table th{background:#f8fafc;padding:9px 12px;text-align:left;font-weight:700;font-size:10.5px;text-transform:uppercase;letter-spacing:.07em;color:var(--mut);border-bottom:1px solid var(--line)}
    .reconciliation-table td{padding:9px 12px;border-bottom:1px solid var(--line)}
    .reconciliation-table input{padding:6px;border:1px solid var(--line2);border-radius:6px;font:13px system-ui;width:100%}
    .lineage-chain{display:flex;gap:12px;align-items:stretch;margin-top:12px;flex-wrap:wrap}
    .lineage-node{background:#f8fafc;border:1px solid var(--line2);border-radius:8px;padding:12px;flex:0 1 auto;min-width:140px}
    .lineage-node .type{font-size:10px;color:var(--mut);font-weight:700;text-transform:uppercase;letter-spacing:.06em}
    .lineage-node .content{font-size:13px;font-weight:600;color:var(--ink);margin-top:4px}
    .lineage-arrow{color:var(--mut2);font-weight:700;align-self:center}
    .completeness-flag{display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:600}
    .pill{display:inline-block;padding:6px 11px;border-radius:20px;background:var(--amber-bg);color:var(--amber-ink);font-size:11px;font-weight:700}
    .pill.live{background:#f0f9ff;color:#0369a1}
    .pill.cached{background:#fef3c7;color:#92400e}
    @media(max-width:820px){
      .main{padding:16px 20px}
      .tiles{grid-template-columns:1fr}
    }
  </style>
</head>
<body>
  <div class="app">
    <aside class="sidebar">
      <div class="brand">
        <div class="brickmark">
          <i></i><i></i><i></i><i></i>
        </div>
        <div>
          <div class="bt">Bricksurance</div>
          <div class="bs">Document Gateway</div>
        </div>
      </div>
      <nav class="nav" id="nav"></nav>
      <div class="side-foot">
        <div style="font-size:11px;font-weight:700;color:#cbd5e1;margin-bottom:8px">MODE</div>
        <button class="pill live" id="modeBtn" style="width:100%;text-align:center;border:none;cursor:pointer;font-weight:700">LIVE</button>
      </div>
    </aside>
    <main class="main">
      <div class="content" id="app"></div>
    </main>
  </div>

  <div class="modal" id="confirmModal">
    <div class="box">
      <h3 style="margin:0 0 12px">Confirm</h3>
      <p id="confirmText" style="margin:0 0 12px;font-size:13px;color:var(--slate)"></p>
      <label for="confirmReason">Reason (optional):</label>
      <textarea id="confirmReason" style="min-height:60px"></textarea>
      <div style="display:flex;gap:10px;margin-top:16px">
        <button class="act" id="confirmBtn" style="flex:1">Confirm</button>
        <button class="ghost" id="cancelBtn" style="flex:1">Cancel</button>
      </div>
    </div>
  </div>

  <script>
    // Global state
    let MODE = 'cached';
    let error = null;
    let toasts = [];
    // Three document flows. Each scopes the nav to its own screens so a user of one
    // flow never sees another's jargon (MRC people don't see bordereaux, etc.).
    const FLOWS = {
      mrc: {label:'Market Reform Contract', short:'MRC', icon:'📜', sub:'Lloyd\'s MRC v3 · open market',
        views:[
          {id:'mrc_inbox', label:'Intake', icon:'📥'},
          {id:'mrc_schemas', label:'Schemas', icon:'🗄️'},
          {id:'mrc_recognition', label:'Schema Recognition', hidden:true, parent:'mrc_schemas'},
          {id:'mrc_changes', label:'Schema Changes', hidden:true, parent:'mrc_schemas'},
          {id:'mrc_semantics', label:'Vocabulary', hidden:true, parent:'mrc_schemas'},
          {id:'mrc_contracts', label:'Contracts', icon:'📜'},
          {id:'mrc_contract', label:'Contract', hidden:true, parent:'mrc_contracts'},
          {id:'mrc_certainty', label:'Contract Certainty', hidden:true, parent:'mrc_contracts'},
          {id:'mrc_lineage', label:'Lineage', hidden:true, parent:'mrc_contracts'},
          {id:'mrc_analytics', label:'Analytics', icon:'📈'},
          {id:'mrc_metrics', label:'Metrics', hidden:true, parent:'mrc_analytics'},
          {id:'mrc_cdr', label:'Core Data Record', hidden:true, parent:'mrc_analytics'},
          {id:'mrc', label:'Contracts & Ask', hidden:true, parent:'mrc_analytics'},
          {id:'mrc_governance', label:'Governance', icon:'🛡️'},
          {id:'mrc_audit', label:'Audit', hidden:true, parent:'mrc_governance'},
          {id:'learn', label:'Learn', icon:'ℹ️'}
        ]},
      bordereaux: {label:'Bordereaux', short:'Bordereaux', icon:'📊', sub:'Delegated authority · premium & claims',
        views:[
          {id:'inbox', label:'Inbox', icon:'📥'},
          {id:'quarantine', label:'Quarantine & Remap', icon:'⚠️'},
          {id:'schema', label:'Schema Recognition', icon:'🧬'},
          {id:'book', label:'The Book', icon:'📖'},
          {id:'lineage', label:'Lineage', icon:'🔗'},
          {id:'templates', label:'Templates', icon:'📋'},
          {id:'audit', label:'Audit', icon:'🔍'},
          {id:'eval', label:'Eval', icon:'✓'},
          {id:'ask', label:'Ask', icon:'💬'},
          {id:'learn', label:'Learn', icon:'ℹ️'}
        ]},
      health_slip: {label:'Health renewal slip', short:'Renewal slip', icon:'🏥', sub:'Config-port',
        views:[
          {id:'config-port', label:'Config-port', icon:'🧩'},
          {id:'learn', label:'Learn', icon:'ℹ️'}
        ]}
    };
    const FLOW_ORDER = ['mrc','bordereaux','health_slip'];
    function flowForView(id){ for(const f of FLOW_ORDER){ if(FLOWS[f].views.some(v=>v.id===id)) return f; } return null; }

    // Agent output is plain markdown; render a safe subset (escape first, then format).
    function md(text) {
      const lines = escapeHtml(text || '').split('\n');
      let html = '', inList = false;
      const inline = t => t.replace(/\*\*(.+?)\*\*/g, '<b>$1</b>');
      for (const raw of lines) {
        const l = raw.trim();
        if (/^[-*] /.test(l)) { if (!inList) { html += '<ul style="margin:6px 0 10px 18px">'; inList = true; } html += '<li>' + inline(l.slice(2)) + '</li>'; continue; }
        if (inList) { html += '</ul>'; inList = false; }
        if (/^#{1,4} /.test(l)) html += '<div style="font-weight:700;margin:12px 0 4px">' + inline(l.replace(/^#+ /, '')) + '</div>';
        else if (l) html += '<p style="margin:6px 0">' + inline(l) + '</p>';
      }
      if (inList) html += '</ul>';
      return html;
    }
    function agentPanel(id, title, desc, btn) {
      return `<div class="card" style="border-left:4px solid #7c3aed">
        <div style="display:flex;justify-content:space-between;align-items:center;gap:12px">
          <div><div style="font-weight:700">🤖 ${escapeHtml(title)}</div><div style="font-size:12px;color:var(--mut)">${escapeHtml(desc)}</div></div>
          <button class="ghost" id="${id}Btn">${escapeHtml(btn)}</button></div>
        <div id="${id}Out" style="margin-top:8px;font-size:13px"></div></div>`;
    }

    // Tabs shared by the three schema screens. Counts show what is waiting.
    async function schemaTabs(active) {
      let st = {};
      try { st = ((await (await fetch('/api/mrc/progress')).json()).states) || {}; } catch (e) {}
      const tab = (id, label, n) => `<a href="#${id}" style="display:inline-block;padding:9px 16px;margin-right:4px;border-radius:9px 9px 0 0;text-decoration:none;font-weight:600;
          ${active === id ? 'background:var(--card);color:var(--ink);border:1px solid var(--line);border-bottom-color:var(--card)' : 'color:var(--mut)'}">${label}${n ? ` <span class="chip differs" style="margin-left:4px">${n}</span>` : ''}</a>`;
      return `<div style="border-bottom:1px solid var(--line);margin-bottom:16px">${tab('mrc_schemas', 'Repository', 0)}${tab('mrc_recognition', 'Recognition', st.new_schema || 0)}${tab('mrc_changes', 'Changes', st.schema_changed || 0)}${tab('mrc_semantics', 'Vocabulary', 0)}</div>`;
    }

    // Fetch helper with loading state
    async function fetchJSON(path, opts = {}) {
      const spinId = 'spin_' + Math.random().toString(36).slice(2);
      const container = document.querySelector('.content');
      const spin = document.createElement('span');
      spin.className = 'spin';
      spin.id = spinId;
      if(container && opts.showSpinner !== false) {
        const existing = container.querySelector('.spin');
        if(!existing) container.appendChild(spin);
      }
      try {
        const url = new URL(path, window.location.origin);
        if(opts.method === 'POST' || opts.method === 'PUT') {
          url.searchParams.set('mode', MODE);
        }
        const response = await fetch(url.toString(), {
          method: opts.method || 'GET',
          headers: {'Content-Type': 'application/json', ...opts.headers},
          body: opts.body ? JSON.stringify(opts.body) : undefined
        });
        if(!response.ok) throw new Error(`HTTP ${response.status}`);
        const data = await response.json();
        spin.remove();
        error = null;
        return data;
      } catch(e) {
        spin.remove();
        error = e.message;
        throw e;
      }
    }

    // Toast notification
    function toast(msg, duration = 3000) {
      const el = document.createElement('div');
      el.className = 'toast';
      el.textContent = msg;
      document.body.appendChild(el);
      setTimeout(() => el.remove(), duration);
    }

    // Modal confirm
    async function confirm(text) {
      return new Promise((resolve) => {
        const modal = document.getElementById('confirmModal');
        const confirmText = document.getElementById('confirmText');
        const confirmReason = document.getElementById('confirmReason');
        const confirmBtn = document.getElementById('confirmBtn');
        const cancelBtn = document.getElementById('cancelBtn');

        confirmText.textContent = text;
        confirmReason.value = '';
        modal.style.display = 'flex';

        const cleanup = () => {
          modal.style.display = 'none';
          confirmBtn.removeEventListener('click', onConfirm);
          cancelBtn.removeEventListener('click', onCancel);
        };

        const onConfirm = () => {
          cleanup();
          resolve({confirmed: true, reason: confirmReason.value});
        };
        const onCancel = () => {
          cleanup();
          resolve({confirmed: false, reason: ''});
        };

        confirmBtn.addEventListener('click', onConfirm);
        cancelBtn.addEventListener('click', onCancel);
      });
    }

    // Format money
    function formatMoney(num, currency = 'GBP') {
      if(num == null) return '—';
      const sign = num < 0 ? '−' : '';
      const abs = Math.abs(num);
      const formatted = new Intl.NumberFormat('en-GB', {
        minimumFractionDigits: 0,
        maximumFractionDigits: 0
      }).format(abs);
      const sym = currency === 'EUR' ? '€' : currency === 'USD' ? '$' : '£';
      return sign + sym + formatted;
    }

    // Render views
    const views = {
      'home': async function() {
        const cards = FLOW_ORDER.map(function(f, i){
          const fl = FLOWS[f]; const first = fl.views[0].id;
          return `<a href="#${first}" style="display:flex;align-items:center;gap:16px;padding:20px;background:var(--card);border:1px solid var(--line);border-radius:14px;box-shadow:var(--shadow);text-decoration:none;color:inherit">
            <div style="font-size:34px;line-height:1">${fl.icon}</div>
            <div><div style="font-size:16px;font-weight:800;color:var(--ink)">${i+1}. ${escapeHtml(fl.label)}</div>
            <div style="font-size:12px;color:var(--mut);margin-top:2px">${escapeHtml(fl.sub)}</div></div>
          </a>`;
        }).join('');
        return `
          <details class="details-summary" open><summary>What am I seeing?</summary>
            <div class="body">Pick a document flow. Each is the same governed loop — recognise a document's data points, record its schema once, then let matching files flow straight through — applied to a different counterparty document. Start with Market Reform Contracts.</div>
          </details>
          <h1 style="margin:6px 0 4px">Document Gateway</h1>
          <div style="color:var(--mut);margin-bottom:22px">One governed loop, three document flows — choose where to start.</div>
          <div style="display:grid;grid-template-columns:1fr;gap:14px;max-width:640px">${cards}</div>`;
      },

      'mrc_inbox': async function() {
        const d = await fetchJSON('/api/mrc/inbox');
        const c = d.state_counts || {};
        const job = d.job || {};
        const META = {
          received: ['plain', 'Received — not yet read'],
          processing: ['plain', 'Reading…'],
          recognised: ['active', 'Known schema → ingested'],
          schema_changed: ['differs', 'Known schema, changed → needs review'],
          new_schema: ['differs', 'New schema → recognise'],
          unrecognised: ['quarantined', 'Not an MRC → needs review'],
          rejected: ['plain', 'Rejected — not an MRC'],
          returned_to_broker: ['plain', 'Returned to broker']
        };
        const m = s => META[s] || ['plain', s];
        const schemaCell = x => x.inbound_state === 'recognised' ? escapeHtml(x.template_version || '')
          : x.inbound_state === 'schema_changed' ? escapeHtml((x.flagged_schema || '') + ' — layout differs')
          : x.inbound_state === 'new_schema' ? '<span style="color:var(--mut)">No registered schema matches</span>'
          : x.inbound_state === 'unrecognised' ? '<span style="color:var(--mut)">—</span>'
          : '<span style="color:var(--mut)">not read yet</span>';
        const act = x => x.inbound_state === 'new_schema'
            ? `<a class="act" style="text-decoration:none;padding:6px 11px;border-radius:8px" href="#mrc_recognition?doc=${encodeURIComponent(x.doc_id)}">Recognise →</a>`
          : x.inbound_state === 'schema_changed'
            ? `<a class="act" style="text-decoration:none;padding:6px 11px;border-radius:8px" href="#mrc_changes?doc=${encodeURIComponent(x.doc_id)}">Review changes →</a>`
          : x.inbound_state === 'unrecognised'
            ? `<button class="ghost" data-mrc-review="reject" data-doc="${escapeAttr(x.doc_id)}">Reject — not an MRC</button>
               <button class="ghost" data-mrc-review="return" data-doc="${escapeAttr(x.doc_id)}">Return to broker</button>` : '';
        const received = (c.received || 0);
        const busy = job.running || (c.processing || 0) > 0;
        const jobMsg = {intake: 'Reading every received document and matching it against the schema repository — known contracts land on their own.',
                        recognise: 'Recording the new schema and ingesting the document…',
                        accept: 'Recording the new schema version and ingesting the document…',
                        reset: 'Resetting the demo to its starting point — about half a minute.'}[job.kind] || 'Working…';
        return `
          <details class="details-summary" open><summary>What am I seeing?</summary>
            <div class="body">Every document that has arrived. Each one is matched against the schema repository by its fingerprint — the document title and its section headings. A match with every expected field lands automatically; a match with changed or missing fields is flagged for review; an MRC with no matching schema goes to schema recognition; anything that is not an MRC is held for a person.</div>
          </details>
          ${busy ? `<div class="banner" id="mrcJobBanner"><span class="spin"></span> <span id="mrcJobText">${escapeHtml(jobMsg)}</span></div>` : ''}
          ${job.error && !busy ? `<div class="error-banner">The last step failed: ${escapeHtml(job.error)}</div>` : ''}
          ${!busy && received ? `<div class="card" style="display:flex;justify-content:space-between;align-items:center;gap:16px;border-left:4px solid var(--brand)">
              <div><div style="font-weight:700">${received} document${received > 1 ? 's' : ''} received, not yet read</div>
              <div style="font-size:12px;color:var(--mut)">In production a file-arrival trigger runs this step automatically.</div></div>
              <button class="act" id="mrcIntakeBtn">Run intake</button></div>` : ''}
          <div class="tiles">
            <div class="tile"><div class="k">Known schema → ingested</div><div class="v pos">${c.recognised || 0}</div></div>
            <div class="tile"><div class="k">Changed → review</div><div class="v warn">${c.schema_changed || 0}</div></div>
            <div class="tile"><div class="k">New schema</div><div class="v warn">${c.new_schema || 0}</div></div>
            <div class="tile"><div class="k">Not an MRC</div><div class="v neg">${c.unrecognised || 0}</div></div>
            <div class="tile"><div class="k">Schemas in repository</div><div class="v">${d.schemas || 0}</div></div>
          </div>
          ${(c.recognised || 0) > 0 && !busy ? agentPanel('mrcIntakeAgent', 'Intake review agent', 'Reads what landed and what was flagged, and says what needs a person. Advises only — every review is logged.', 'Review this intake') : ''}
          <div id="mrcPdfViewer"></div>
          <div class="card"><div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:6px">
            <h2 style="margin:0">Documents</h2>
            <button class="ghost" id="mrcResetBtn" ${busy ? 'disabled' : ''} title="Return this flow to the demo starting point">↺ Reset demo</button></div>
            <table><thead><tr><th>File</th><th>Broker</th><th>Schema</th><th>State</th><th></th></tr></thead>
            <tbody>${d.documents.map(x => `<tr>
              <td style="font-weight:600">${escapeHtml(x.file_name)}</td>
              <td>${escapeHtml(x.counterparty && x.counterparty !== '—' ? x.counterparty : '—')}</td>
              <td style="font-size:12px">${schemaCell(x)}</td>
              <td><span class="chip ${m(x.inbound_state)[0]}">${escapeHtml(m(x.inbound_state)[1])}</span></td>
              <td style="white-space:nowrap"><button class="ghost" data-mrc-view="${escapeAttr(x.doc_id)}" data-name="${escapeAttr(x.file_name)}">View</button> ${act(x)}</td></tr>`).join('')}</tbody></table></div>
          <script>
            var ab = document.getElementById('mrcIntakeAgentBtn');
            if (ab) { ab.addEventListener('click', async function(){
              var out = document.getElementById('mrcIntakeAgentOut');
              ab.disabled = true; out.innerHTML = '<span class="spin"></span> The agent is reviewing the intake…';
              try { var r = await fetchJSON('/api/mrc/agent/intake_review', {method:'POST', body:{}});
                    out.innerHTML = md(r.review) + '<div style="font-size:11px;color:var(--mut);margin-top:6px">Logged as ' + escapeHtml(r.note_id) + ' · advises only · see Governance</div>'; }
              catch(e) { out.innerHTML = '<div class="error-banner">' + escapeHtml(e.message) + '</div>'; }
              ab.disabled = false;
            }); }
            var ib = document.getElementById('mrcIntakeBtn');
            if (ib) { ib.addEventListener('click', async function(){
              ib.disabled = true; ib.textContent = 'Starting…';
              try { await fetchJSON('/api/mrc/intake', {method:'POST', body:{}}); render(); }
              catch(e){ toast('Could not start intake: ' + e.message); ib.disabled = false; ib.textContent = 'Run intake'; }
            }); }
            document.querySelectorAll('[data-mrc-view]').forEach(function(b){
              b.addEventListener('click', function(){
                var id = b.getAttribute('data-mrc-view');
                var url = '/api/mrc/pdf/' + encodeURIComponent(id);
                var box = document.getElementById('mrcPdfViewer');
                box.innerHTML = '<div class="card"><div style="display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:10px">'
                  + '<h2 style="margin:0">' + escapeHtml(b.getAttribute('data-name')) + '</h2>'
                  + '<div style="display:flex;gap:8px"><a class="ghost" style="text-decoration:none;padding:7px 12px;border-radius:8px" href="' + url + '" target="_blank" rel="noopener">Open in new tab ↗</a>'
                  + '<button class="ghost" id="mrcPdfClose">Close</button></div></div>'
                  + '<iframe src="' + url + '" title="PDF preview" style="width:100%;height:720px;border:1px solid var(--line);border-radius:8px;background:#fff"></iframe></div>';
                document.getElementById('mrcPdfClose').addEventListener('click', function(){ box.innerHTML = ''; });
                box.scrollIntoView({behavior:'smooth', block:'start'});
              });
            });
            document.querySelectorAll('[data-mrc-review]').forEach(function(b){
              b.addEventListener('click', async function(){
                var action = b.getAttribute('data-mrc-review');
                var c = await confirm(action === 'reject' ? 'Reject this document? It is not a Market Reform Contract.' : 'Return this document to the broker for a full MRC?');
                if(!c.confirmed){ return; }
                try{
                  await fetchJSON('/api/mrc/review',{method:'POST',body:{doc_id:b.getAttribute('data-doc'),action:action,reason:c.reason}});
                  toast(action === 'reject' ? 'Rejected — decision recorded' : 'Returned to broker — decision recorded');
                  render();
                }catch(e){ toast('Error: '+e.message); }
              });
            });
            document.getElementById('mrcResetBtn').addEventListener('click', async function(){
              var c = await confirm('Reset the MRC demo to its starting point? This clears every schema except the pre-registered open-market one, all processed contracts, checks, decisions and the audit trail for this flow, and marks all eight documents as received again.');
              if(!c.confirmed){ return; }
              try{ await fetchJSON('/api/mrc/reset',{method:'POST',body:{}}); toast('Resetting the demo…'); setTimeout(function(){ render(); }, 1200); }
              catch(e){ toast('Could not reset: '+e.message); }
            });
            if (${busy ? 'true' : 'false'}) {
              // Keep this page still: only the banner text updates; redraw once when the step ends.
              window.__mrcPoll = setInterval(async function(){
                if ((window.location.hash||'').indexOf('#mrc_inbox') !== 0) { clearInterval(window.__mrcPoll); window.__mrcPoll = null; return; }
                var d; try { d = await (await fetch('/api/mrc/progress')).json(); } catch(e) { return; }
                var st = d.states || {}, total = 0; for (var k in st) { total += st[k]; }
                var waiting = (st.received || 0) + (st.processing || 0);
                var el = document.getElementById('mrcJobText');
                if (el && d.kind === 'intake') {
                  el.textContent = 'Reading and matching against the schema repository — ' + (total - waiting) + ' of ' + total + ' done · '
                    + (st.recognised || 0) + ' known · ' + (st.schema_changed || 0) + ' changed · ' + (st.new_schema || 0) + ' new · '
                    + (st.unrecognised || 0) + ' not an MRC';
                }
                if (!d.running && !(st.processing > 0)) { clearInterval(window.__mrcPoll); window.__mrcPoll = null; render(true); }
              }, 3000);
            }
          <\/script>`;
      },

      'mrc_recognition': async function() {
        const qs = new URLSearchParams((window.location.hash.split('?')[1]) || '');
        const doc = qs.get('doc');
        const tabs = await schemaTabs('mrc_recognition');
        const explain = `<details class="details-summary" open><summary>What am I seeing?</summary>
            <div class="body">Schema recognition for a document no registered schema matches. Fields the shared vocabulary already knows are reused as they are; unfamiliar fields are mapped to an ACORD term by the model, with its stated confidence. Check or change each mapping, then record the schema — every future document with this fingerprint is read with it automatically.</div></details>`;
        if (!doc) {
          const w = (await fetchJSON('/api/mrc/propose')).waiting || [];
          return tabs + explain + `<div class="card"><h2 style="margin-top:0">Documents waiting for recognition</h2>` +
            (w.length ? `<table><tbody>${w.map(x => `<tr><td style="font-weight:600">${escapeHtml(x.file_name)}</td>

              <option value="">— no ACORD term —</option>${p.bindings.map(b => opt(b, f.binding)).join('')}</select></td>
          <td style="font-size:12px">${f.cdr ? escapeHtml(f.cdr) : '<span style="color:var(--mut)">—</span>'}</td>
          <td style="font-size:12px">${f.origin === 'known field' ? '<span class="chip active">known field</span>'
              : `<span class="chip differs">model</span> ${f.confidence != null ? Math.round(f.confidence * 100) + '%' : ''}${f.why ? `<div style="color:var(--mut);margin-top:3px">${escapeHtml(f.why)}</div>` : ''}`}</td>
          <td><input data-note="${i}" aria-label="Note for ${escapeAttr(f.label)}" placeholder="optional" style="width:130px;padding:5px;border:1px solid var(--line2);border-radius:6px"></td></tr>`).join('');
        const known = p.fields.filter(f => f.origin === 'known field').length;
        return tabs + explain + `<div class="strip">
            <div><div class="lbl">Document</div><div class="big brand" style="font-size:18px">${escapeHtml(p.file_name)}</div></div>
            <div><div class="lbl">Fingerprint</div><div class="big" style="font-size:15px">${escapeHtml(p.fingerprint.title)}</div></div>
            <div><div class="lbl">Fields reused · proposed</div><div class="big">${known} · ${p.fields.length - known}</div></div>
          </div>
          <div class="card">
            <div style="display:flex;gap:12px;align-items:center;margin-bottom:12px">
              <label for="mrcSchemaName" style="font-weight:600;white-space:nowrap">Schema name</label>
              <input id="mrcSchemaName" value="${escapeAttr(p.suggested_name)}" style="flex:1;padding:8px;border:1px solid var(--line2);border-radius:8px">
              <a class="ghost" style="text-decoration:none;padding:7px 12px;border-radius:8px" href="/api/mrc/pdf/${encodeURIComponent(p.doc_id)}" target="_blank" rel="noopener">View PDF ↗</a>
            </div>
            <div style="margin-bottom:14px">
              <label for="mrcSchemaDesc" style="font-weight:600;display:block;margin-bottom:4px">Description — what this document is</label>
              <textarea id="mrcSchemaDesc" rows="2" placeholder="e.g. A binding authority agreement: lets a coverholder bind business on the syndicates' behalf within agreed classes, territory and limits; reported monthly by bordereaux." style="width:100%;padding:8px;border:1px solid var(--line2);border-radius:8px;font:inherit"></textarea>
            </div>
            <table><thead><tr><th></th><th>Field</th><th>Section</th><th style="min-width:200px">Value · source line</th><th>ACORD term</th><th>CDR field*</th><th>Mapping</th><th>Note</th></tr></thead>
            <tbody>${rows}</tbody></table>
            <div style="font-size:11px;color:var(--mut);margin-top:8px">* Indicative Lloyd's Core Data Record field — a paraphrased crosswalk for discussion, not the published specification. Values are read by section and label; the model only proposes the mapping for unfamiliar fields.</div>
            <div style="margin-top:14px">${agentPanel('mrcSchemaAgent', 'Schema review agent', 'Critiques this proposed schema before you record it — duplicates, weak mappings, gaps a Core Data Record would need. Advises only.', 'Review this schema')}</div>
            <div style="margin-top:16px;display:flex;align-items:center;gap:12px">
              <button class="act" id="mrcConfirmBtn">Confirm &amp; record schema</button>
              <span style="color:var(--mut);font-size:12px">Records the schema as v1 in the repository and ingests this document with it.</span>
            </div>
          </div>
          <script>
            document.getElementById('mrcSchemaAgentBtn').addEventListener('click', async function(){
              var p = window.__mrcProposal, b = this, out = document.getElementById('mrcSchemaAgentOut');
              var fields = p.fields.map(function(f, i){
                return {field: f.label, section: f.section, value: f.value, origin: f.origin, confidence: f.confidence,
                        include: document.querySelector('[data-inc="' + i + '"]').checked,
                        acord_term: document.querySelector('[data-bind="' + i + '"]').value || null, cdr: f.cdr};
              });
              b.disabled = true; out.innerHTML = '<span class="spin"></span> The agent is reviewing the proposed schema…';
              try { var r = await fetchJSON('/api/mrc/agent/schema_review', {method:'POST', body:{kind:'recognition', payload:{
                        file_name: p.file_name, fingerprint: p.fingerprint, name: document.getElementById('mrcSchemaName').value,
                        description: document.getElementById('mrcSchemaDesc').value, fields: fields}}});
                    out.innerHTML = md(r.review) + '<div style="font-size:11px;color:var(--mut);margin-top:6px">Logged as ' + escapeHtml(r.note_id) + ' · advises only</div>'; }
              catch(e) { out.innerHTML = '<div class="error-banner">' + escapeHtml(e.message) + '</div>'; }
              b.disabled = false;
            });
            document.getElementById('mrcConfirmBtn').addEventListener('click', async function(){
              var p = window.__mrcProposal, b = this;
              var fields = p.fields.map(function(f, i){
                var o = Object.assign({}, f);
                o.include = document.querySelector('[data-inc="' + i + '"]').checked;
                o.binding = document.querySelector('[data-bind="' + i + '"]').value || null;
                o.note = document.querySelector('[data-note="' + i + '"]').value || '';

              });
              b.disabled = true; b.textContent = 'Recording…';
              try {
                await fetchJSON('/api/mrc/confirm', {method:'POST', body:{doc_id:p.doc_id, name:document.getElementById('mrcSchemaName').value,

                setTimeout(function(){ window.location.hash = '#mrc_inbox'; }, 700);

      'mrc_changes': async function() {
        const qs = new URLSearchParams((window.location.hash.split('?')[1]) || '');
        const doc = qs.get('doc');
        const tabs = await schemaTabs('mrc_changes');
        const explain = `<details class="details-summary" open><summary>What am I seeing?</summary>
            <div class="body">A document that matches a registered schema's fingerprint but not every field: something was renamed or left out. Renames are proposed by text similarity; missing fields stay missing and remain visible as gaps downstream. Accepting records the next version of the schema, which has learned the new labels.</div></details>`;
        if (!doc) {
          const inbox = await fetchJSON('/api/mrc/inbox');
          const w = (inbox.documents || []).filter(x => x.inbound_state === 'schema_changed');
          return tabs + explain + `<div class="card"><h2 style="margin-top:0">Documents with layout changes</h2>` +
            (w.length ? `<table><tbody>${w.map(x => `<tr><td style="font-weight:600">${escapeHtml(x.file_name)}</td>
              <td style="text-align:right"><a class="act" style="text-decoration:none;padding:6px 11px;border-radius:8px" href="#mrc_changes?doc=${encodeURIComponent(x.doc_id)}">Review changes →</a></td></tr>`).join('')}</tbody></table>`
             : `<div style="color:var(--mut)">No flagged layout changes. They appear here after <a href="#mrc_inbox">Run intake</a>.</div>`) + `</div>`;
        }
        const c = await fetchJSON('/api/mrc/changes?doc_id=' + encodeURIComponent(doc));
        const next = 'v' + (parseInt(String(c.version || 'v1').replace('v', ''), 10) + 1);
        const labels = c.doc_labels || [];
        const rows = (c.diff || []).map(r => {
          const renamed = r.change === 'renamed';
          const opts = renamed
            ? `<option value="rename" selected>Accept rename → “${escapeHtml(r.found_label)}”</option><option value="map">Map to another field…</option><option value="gap">Keep as a gap</option>`
            : `<option value="gap" selected>Keep as a gap</option><option value="map">Map to a field in the document…</option>`;
          return `<tr>
          <td style="font-weight:600">${escapeHtml(r.data_point)}<div style="font-size:11px;color:var(--mut)">${escapeHtml(r.section)}</div></td>
          <td><span class="chip ${renamed ? 'differs' : 'quarantined'}">${renamed ? 'renamed' : 'missing'}</span></td>
          <td>${escapeHtml(r.expected_label || '—')}</td>
          <td>${r.found_label ? escapeHtml(r.found_label) + ` <span style="font-size:11px;color:var(--mut)">(${Math.round(r.similarity * 100)}% similar)</span>` : '<span style="color:var(--mut)">not in the document</span>'}
              ${r.source_quote ? `<div style="font-size:11px;color:var(--mut);margin-top:3px">“${escapeHtml(r.source_quote)}”</div>` : ''}</td>
          <td><select data-dec="${escapeAttr(r.key)}" aria-label="Decision for ${escapeAttr(r.data_point)}" style="padding:5px;border:1px solid var(--line2);border-radius:6px;max-width:230px">${opts}</select>
              <select data-map="${escapeAttr(r.key)}" aria-label="Document field for ${escapeAttr(r.data_point)}" disabled style="display:block;margin-top:5px;padding:5px;border:1px solid var(--line2);border-radius:6px;max-width:230px">
                <option value="">— choose a field —</option>${labels.map(l => `<option value="${escapeAttr(l)}">${escapeHtml(l)}</option>`).join('')}</select></td>
          <td><input data-dnote="${escapeAttr(r.key)}" aria-label="Note for ${escapeAttr(r.data_point)}" placeholder="optional" style="width:140px;padding:5px;border:1px solid var(--line2);border-radius:6px"></td></tr>`;
        }).join('');
        const found = (c.points || []).filter(p => p.status === 'identified').length;
        window.__mrcChangesDoc = c.doc_id;
        window.__mrcChanges = c;
        return tabs + explain + `<div class="strip">
            <div><div class="lbl">Document</div><div class="big brand" style="font-size:18px">${escapeHtml(c.file_name)}</div></div>
            <div><div class="lbl">Matched schema</div><div class="big" style="font-size:15px">${escapeHtml(c.schema || '—')} ${escapeHtml(c.version || '')}</div></div>
            <div><div class="lbl">Fields found as expected</div><div class="big">${found}/${(c.points || []).length}</div></div>
          </div>
          <div class="card"><h2 style="margin-top:0">What changed — decide each field</h2>
            <table><thead><tr><th>Data point</th><th>Change</th><th>Schema expects</th><th>Document has</th><th>Decision</th><th>Note</th></tr></thead>
            <tbody>${rows}</tbody></table>
            <div style="margin:14px 0 6px">
              <label for="mrcChangeNote" style="font-weight:600;display:block;margin-bottom:4px">Change note — why this version is being recorded</label>
              <textarea id="mrcChangeNote" rows="2" placeholder="e.g. Marsh's construction template renames two fields; governing law and settlement date to be chased with the broker." style="width:100%;padding:8px;border:1px solid var(--line2);border-radius:8px;font:inherit"></textarea>
            </div>
            ${agentPanel('mrcChangeAgent', 'Schema review agent', 'Checks the proposed amendment — does each rename keep its meaning, which gaps matter, what to ask the broker. Advises only.', 'Review these changes')}
            <div style="margin-top:12px;display:flex;align-items:center;gap:10px;flex-wrap:wrap">
              <button class="act" id="mrcAcceptBtn">Accept &amp; record ${escapeHtml(next)}</button>
              <button class="ghost" id="mrcReturnBtn">Return to broker</button>
              <a class="ghost" style="text-decoration:none;padding:7px 12px;border-radius:8px" href="/api/mrc/pdf/${encodeURIComponent(c.doc_id)}" target="_blank" rel="noopener">View PDF ↗</a>
              <span style="color:var(--mut);font-size:12px">Renames and mappings are learned by the new version; gaps stay flagged downstream.</span>
            </div></div>
          <script>
            document.querySelectorAll('[data-dec]').forEach(function(sel){
              sel.addEventListener('change', function(){
                var m = document.querySelector('[data-map="' + sel.getAttribute('data-dec') + '"]');
                m.disabled = sel.value !== 'map';
              });
            });
            document.getElementById('mrcChangeAgentBtn').addEventListener('click', async function(){
              var c = window.__mrcChanges, b = this, out = document.getElementById('mrcChangeAgentOut'), decisions = {};
              document.querySelectorAll('[data-dec]').forEach(function(sel){
                var k = sel.getAttribute('data-dec');
                decisions[k] = {action: sel.value, mapped_to: document.querySelector('[data-map="' + k + '"]').value || null,
                                note: document.querySelector('[data-dnote="' + k + '"]').value || ''};
              });
              b.disabled = true; out.innerHTML = '<span class="spin"></span> The agent is reviewing the amendment…';
              try { var r = await fetchJSON('/api/mrc/agent/schema_review', {method:'POST', body:{kind:'changes', payload:{
                        file_name: c.file_name, schema: c.schema, version: c.version, changes: c.diff, decisions: decisions,
                        change_note: document.getElementById('mrcChangeNote').value}}});
                    out.innerHTML = md(r.review) + '<div style="font-size:11px;color:var(--mut);margin-top:6px">Logged as ' + escapeHtml(r.note_id) + ' · advises only</div>'; }
              catch(e) { out.innerHTML = '<div class="error-banner">' + escapeHtml(e.message) + '</div>'; }
              b.disabled = false;
            });
            document.getElementById('mrcAcceptBtn').addEventListener('click', async function(){
              var b = this, decisions = {}, problem = null;
              document.querySelectorAll('[data-dec]').forEach(function(sel){
                var k = sel.getAttribute('data-dec');
                var label = document.querySelector('[data-map="' + k + '"]').value;
                if (sel.value === 'map' && !label) { problem = 'Choose a document field for every row set to Map.'; }
                decisions[k] = {action: sel.value, label: sel.value === 'map' ? label : null,
                                note: document.querySelector('[data-dnote="' + k + '"]').value || ''};
              });
              if (problem) { toast(problem); return; }
              b.disabled = true; b.textContent = 'Recording…';
              try { await fetchJSON('/api/mrc/accept_changes', {method:'POST', body:{doc_id: window.__mrcChangesDoc, decisions: decisions,
                      change_note: document.getElementById('mrcChangeNote').value}});
                    toast('New schema version recorded — ingesting the document'); setTimeout(function(){ window.location.hash = '#mrc_inbox'; }, 700); }
              catch(e) { toast('Could not accept: ' + e.message); b.disabled = false; b.textContent = 'Accept & record'; }
            });
            document.getElementById('mrcReturnBtn').addEventListener('click', async function(){
              var r = await confirm('Return this document to the broker to fix the layout?');
              if(!r.confirmed){ return; }
              try { await fetchJSON('/api/mrc/review', {method:'POST', body:{doc_id: window.__mrcChangesDoc, action:'return', reason:r.reason}});
                    toast('Returned to broker — decision recorded'); window.location.hash = '#mrc_inbox'; }
              catch(e) { toast('Error: ' + e.message); }
            });
          <\/script>`;
      },

                <td style="font-size:12px;color:var(--mut)">${escapeHtml(p.note || '')}</td></tr>`).join('')}</tbody></table></details>

      'eval': async function() {
        const data = await fetchJSON('/api/eval');
        const overall = data.overall || [];
        const fields = data.fields || [];
        if (!data.run_id) {
          return `<details class="details-summary" open><summary>What am I seeing?</summary>
            <div class="body">Accuracy of the AI extraction path, scored against synthetic ground truth.</div></details>
            <div class="card">No eval run yet — run <code>eval/run_eval.py</code>.</div>`;
        }
        const models = [...new Set(fields.map(f => f.model))];
        const fieldNames = [...new Set(fields.map(f => f.field))];
        const cell = (fn, m) => {
          const r = fields.find(x => x.field === fn && x.model === m);
          if (!r) return '<td>—</td>';
          const pct = (r.accuracy * 100).toFixed(0) + '%';
          const cls = r.accuracy >= 1 ? 'active' : 'differs';
          return `<td><span class="chip ${cls}">${pct}</span></td>`;
        };
        return `
          <details class="details-summary" open><summary>What am I seeing?</summary>
            <div class="body">The AI extraction path maps each source column to a canonical dictionary field. Because we generate the documents, the true mapping is known — so we score it, per field and per model, including decoy columns the model must ignore. This is the answer to "doesn't the model just hallucinate?".</div>
          </details>
          <div class="tiles">
            ${overall.map(o => `<div class="tile"><div class="k">${escapeHtml(o.model)}</div>
              <div class="v pos">${(o.accuracy * 100).toFixed(0)}%</div>
              <div class="k">${o.correct}/${o.total} fields${o.mlflow_run_id ? ' · logged to MLflow' : ''}</div></div>`).join('')}
          </div>
          <div class="card">
            <h2>Per-field mapping accuracy — model comparison</h2>
            <table><thead><tr><th>Field</th>${models.map(m => `<th>${escapeHtml(m)}</th>`).join('')}</tr></thead>
              <tbody>${fieldNames.map(fn => `<tr><td style="font-weight:600">${escapeHtml(fn)}</td>${models.map(m => cell(fn, m)).join('')}</tr>`).join('')}</tbody>
            </table>
          </div>`;
      },
      'mrc_contracts': async function() {
        const d = await fetchJSON('/api/mrc/contracts');
        const rows = d.contracts || [];
        const short = n => (n || '').replace("Lloyd's MRC v3 — ", '').replace(' (ACORD)', '');
        const explain = `<details class="details-summary" open><summary>What am I seeing?</summary>
            <div class="body">Every contract that has been read and loaded. Search by insured, coverholder, broker, class, syndicate or UMR; open any contract to see its checks, every value with the line it came from, its Core Data Record fields, the PDF and its history.</div></details>`;

        return explain + `<div class="card" style="display:flex;gap:10px;align-items:center;flex-wrap:wrap">
            <input id="mrcSearch" aria-label="Search contracts" placeholder="Search — e.g. marine, Willis, Hiscox, B0425…" style="flex:1;min-width:260px;padding:9px;border:1px solid var(--line2);border-radius:8px">

            <button class="ghost" data-filter="attention">Needs attention (${attention})</button></div>
          <div class="card"><table><thead><tr><th>UMR</th><th>Insured / coverholder</th><th>Class</th><th>Broker</th><th>Lead</th><th class="num">Premium</th><th>Certainty</th><th>Schema</th></tr></thead>
          <tbody>${rows.map(r => `<tr class="row" style="cursor:pointer" data-href="#mrc_contract?m=${encodeURIComponent(r.mrc_id)}"
               data-att="${r.certainty_status !== 'pass' ? '1' : '0'}"
               data-text="${escapeAttr([r.umr, r.insured_name, r.class_of_business, r.broker_name, r.slip_leader, r.syndicates, r.schema_name].join(' ').toLowerCase())}">

            <td class="num">${r.premium_amount ? formatMoney(Number(r.premium_amount), r.premium_currency) : '—'}</td>

            <td style="font-size:12px">${escapeHtml(short(r.schema_name))} ${escapeHtml(r.schema_version || '')}</td></tr>`).join('')}</tbody></table>
          <div id="mrcNoMatch" style="display:none;color:var(--mut);padding:10px">No contracts match.</div></div>
          <script>
            var mode = 'all';
            function applyFilter(){
              var terms = (document.getElementById('mrcSearch').value || '').toLowerCase().split(/\s+/).filter(Boolean), shown = 0;
              document.querySelectorAll('tr[data-text]').forEach(function(tr){
                var t = tr.getAttribute('data-text'), ok = terms.every(function(w){ return t.indexOf(w) >= 0; });

                tr.style.display = ok ? '' : 'none'; if (ok) { shown++; }
              });
              document.getElementById('mrcNoMatch').style.display = shown ? 'none' : 'block';
            }
            document.getElementById('mrcSearch').addEventListener('input', applyFilter);
            document.querySelectorAll('[data-filter]').forEach(function(b){ b.addEventListener('click', function(){ mode = b.getAttribute('data-filter'); applyFilter(); }); });
            document.querySelectorAll('tr[data-href]').forEach(function(tr){ tr.addEventListener('click', function(){ window.location.hash = tr.getAttribute('data-href'); }); });

      },

      'mrc_contract': async function() {

        return `<div style="margin-bottom:10px"><a href="#mrc_contracts">← All contracts</a></div>
          <div class="strip">
            <div><div class="lbl">${escapeHtml(c.class_of_business)}</div><div class="big brand" style="font-size:20px">${escapeHtml(c.insured_name)}</div></div>

            <div><div class="lbl">Certainty</div><div class="big ${fails.length ? 'neg' : 'pos'}" style="font-size:18px">${fails.length ? fails.length + ' failed' : 'all pass'}</div></div>
          </div>
          <div style="margin:10px 0 14px">${tabBtn('overview','Overview')}${tabBtn('certainty','Certainty')}${tabBtn('values','Values &amp; lineage')}${tabBtn('cdr','Core Data Record')}${tabBtn('doc','Document')}${tabBtn('history','History')}</div>
          ${sec('overview', `<div class="card"><div style="display:grid;grid-template-columns:repeat(3,1fr);gap:16px">
              ${fact('Broker', c.broker_name)}${fact('Slip leader', c.slip_leader)}${fact('Signed lines', c.signed_lines_total ? Number(c.signed_lines_total).toFixed(2) + '%' : '')}

              ${fact('Headline limit', c.headline_limit)}${fact('Deductible', c.deductible_text)}${fact('Premium (as written)', c.premium_text)}
              ${fact('Schema', (c.schema_name || '') + ' ' + (c.schema_version || ''))}${fact('Source document', c.file_name)}${fact('Loaded', String(c.ingested_at || '').slice(0, 16).replace('T', ' '))}
            </div>${fails.length ? `<div class="banner" style="margin-top:14px">Needs attention: ${fails.map(f => escapeHtml(f.label)).join(' · ')}</div>` : ''}</div>`)}
          ${sec('certainty', `<div class="card"><table><tbody>${d.checks.map(x => `<tr>
              <td style="width:100px"><span class="chip ${x.status === 'pass' ? 'active' : 'quarantined'}">${x.status === 'pass' ? '✓ pass' : '✗ fail'}</span></td>
              <td style="font-weight:600">${escapeHtml(x.label)}</td><td style="font-size:12px;color:var(--mut)">${escapeHtml(x.detail)}</td></tr>`).join('')}</tbody></table></div>`)}
          ${sec('values', `<div class="card"><table><thead><tr><th>Data point</th><th>Value</th><th>MRC section</th><th>Source line in the contract</th><th>ACORD term</th></tr></thead>
              <tbody>${d.values.map(x => `<tr><td style="font-weight:600">${escapeHtml(x.label)}</td><td>${escapeHtml(x.value || '—')}</td><td style="font-size:12px">${escapeHtml(x.section)}</td>
              <td style="font-size:12px;color:var(--slate2)">${x.source_quote ? '“' + escapeHtml(x.source_quote) + '”' : '<span style="color:var(--mut)">not found in the contract</span>'}</td>

          ${sec('cdr', `<div class="card"><div class="banner">Indicative crosswalk to the Lloyd's Core Data Record — field names paraphrased, not the published specification.</div>

          ${sec('doc', `<div class="card"><div style="margin-bottom:8px"><a href="${escapeAttr(d.pdf)}" target="_blank" rel="noopener">Open in new tab ↗</a></div>

          ${sec('history', `<div class="card"><table><thead><tr><th>When</th><th>Event</th><th>By</th><th>Detail</th></tr></thead><tbody>${d.history.map(e => `<tr>
              <td style="white-space:nowrap">${escapeHtml(new Date(e.created_at).toLocaleString())}</td><td><span class="chip plain">${escapeHtml(e.event_type)}</span></td>
              <td>${escapeHtml(e.actor || '')}</td><td style="font-size:12px;color:var(--mut)">${escapeHtml(e.detail || '')}</td></tr>`).join('')}</tbody></table></div>`)}

            showTab('overview');
          <\/script>`;
      },

      'mrc_analytics': async function() {
        const examples = ['Show me all contracts placed by Willis Towers Watson on marine',
                          'Which syndicates lead the most premium?',
                          'Which contracts fail a certainty check, and why?',
                          'What are the exclusions on the cyber contract?'];
        const ask = `<details class="details-summary" open><summary>What am I seeing?</summary>
            <div class="body">The analytics agent answers questions about the whole book in two ways at once: Genie writes a query over the extracted, governed data (the query is shown), and a Knowledge Assistant answers from the contract wording itself. Below are book-level metrics, kept per currency.</div></details>
          <div class="card" style="border-left:4px solid #7c3aed">
            <div style="font-weight:700;margin-bottom:8px">🤖 Analytics agent — ask the book</div>
            <div style="display:flex;gap:10px"><input type="text" id="mrcAskInput" aria-label="Ask a question about the contracts" placeholder="Ask anything about the contracts…" style="flex:1;padding:9px;border:1px solid var(--line2);border-radius:8px">
              <button class="act" id="mrcAskBtn">Ask</button></div>
            <div style="margin-top:8px">${examples.map(e => `<button class="chipq" data-ex="${escapeAttr(e)}" style="margin:3px">${escapeHtml(e)}</button>`).join('')}</div>
            <div id="mrcAskResult" style="margin-top:12px"></div></div>
          <script>
            var inp = document.getElementById('mrcAskInput');
            document.querySelectorAll('[data-ex]').forEach(function(b){ b.addEventListener('click', function(){ inp.value = b.getAttribute('data-ex'); document.getElementById('mrcAskBtn').click(); }); });
            inp.addEventListener('focus', function(){ this.select(); });
            inp.addEventListener('keydown', function(ev){ if (ev.key === 'Enter') { document.getElementById('mrcAskBtn').click(); } });
            document.getElementById('mrcAskBtn').addEventListener('click', async function(){
              var q = inp.value.trim(); if (!q) { return; }
              var box = document.getElementById('mrcAskResult');
              box.innerHTML = '<span class="spin"></span> Asking both — the structured answer usually arrives first…';
              var res;
              try { res = await fetchJSON('/api/mrc/ask', {method:'POST', body:{question:q}}); }
              catch(e) { box.innerHTML = '<div class="error-banner">' + escapeHtml(e.message) + '</div>'; return; }
              var h = '';
              if (res.genie) {
                h += '<div class="card"><div style="font-weight:700;margin-bottom:6px">From the extracted data (Genie)</div>';
                if (res.genie.answer) { h += md(res.genie.answer); }
                if (res.genie.sql) { h += '<details><summary style="cursor:pointer;font-size:12px">Show the query</summary><pre style="background:#f8fafc;padding:10px;border-radius:8px;overflow-x:auto;font:12px ui-monospace,Menlo,monospace">' + escapeHtml(res.genie.sql) + '</pre></details>'; }
                if (res.genie.error) { h += '<p style="color:var(--mut)">' + escapeHtml(res.genie.error) + '</p>'; }
                h += '</div>';
              }

              box.innerHTML = h;
            });

        const more = `<div class="card" style="display:flex;gap:18px;flex-wrap:wrap;align-items:center"><b>Across the book:</b>
            <a href="#mrc_cdr">Core Data Record completeness →</a><a href="#mrc_certainty">Contract certainty, every contract →</a><a href="#mrc_lineage">Lineage explorer →</a></div>`;
        return ask + more + await views.mrc_metrics();
      },

      'mrc_certainty': async function() {
        const d = await fetchJSON('/api/mrc/certainty');
        const rows = d.rows || [];
        const explain = `<details class="details-summary" open><summary>What am I seeing?</summary>
            <div class="body">Contract certainty: simple, deterministic rules every bound contract should pass — the order is fully signed, the several-liability notice and sanctions clause are present, the period and reference are well-formed, the slip leader is on the security, and the governing law is stated. No AI decides these; each result shows the line it was checked against.</div></details>`;
        if (!rows.length) return explain + `<div class="card">No contracts ingested yet — record the schema in <a href="#mrc_recognition">Schema Recognition</a> first.</div>`;
        const byC = {};
        rows.forEach(r => { (byC[r.umr] = byC[r.umr] || {umr: r.umr, insured: r.insured_name, cls: r.class_of_business, mrc_id: r.mrc_id, checks: []}).checks.push(r); });
        const contracts = Object.values(byC);
        const passing = contracts.filter(c => c.checks.every(x => x.status === 'pass')).length;
        const card = c => {
          const fails = c.checks.filter(x => x.status === 'fail');
          return `<div class="card" style="border-left:4px solid ${fails.length ? 'var(--red)' : 'var(--emerald)'}">
            <div style="display:flex;justify-content:space-between;align-items:baseline;gap:12px">
              <h2 style="margin:0">${escapeHtml(c.insured)} <span style="font-weight:400;color:var(--mut);font-size:13px">${escapeHtml(c.cls)} · ${escapeHtml(c.umr)}</span></h2>
              <span class="chip ${fails.length ? 'quarantined' : 'active'}">${fails.length ? fails.length + ' check' + (fails.length > 1 ? 's' : '') + ' failed' : 'all checks pass'}</span>
            </div>
            <table style="margin-top:10px"><tbody>${c.checks.map(x => `<tr>
              <td style="width:110px"><span class="chip ${x.status === 'pass' ? 'active' : 'quarantined'}">${x.status === 'pass' ? '✓ pass' : '✗ fail'}</span></td>
              <td style="font-weight:600">${escapeHtml(x.label)}</td>
              <td style="color:var(--mut);font-size:12px">${escapeHtml(x.detail)}</td></tr>`).join('')}</tbody></table>
            <div style="margin-top:8px"><a href="#mrc_lineage?m=${encodeURIComponent(c.mrc_id)}">See every value and its source line →</a></div></div>`;
        };
        return explain + `<div class="tiles">
            <div class="tile"><div class="k">Contracts checked</div><div class="v">${contracts.length}</div></div>
            <div class="tile"><div class="k">Pass every check</div><div class="v pos">${passing}</div></div>
            <div class="tile"><div class="k">Need attention</div><div class="v neg">${contracts.length - passing}</div></div>
            <div class="tile"><div class="k">Checks run</div><div class="v">${d.total}</div></div>
            <div class="tile"><div class="k">Checks failed</div><div class="v neg">${d.failed}</div></div>
          </div>` + contracts.sort((a, b) => b.checks.filter(x => x.status === 'fail').length - a.checks.filter(x => x.status === 'fail').length).map(card).join('');
      },

      'mrc_metrics': async function() {
        const d = await fetchJSON('/api/mrc/metrics');
        const contracts = d.contracts || [];
        const t = d.totals || {};
        const fmt = (x, ccy) => (x == null || x === '') ? '—' : formatMoney(Number(x), ccy || 'GBP');
        const explain = `
          <details class="details-summary" open>
            <summary>What am I seeing?</summary>
            <div class="body">The numeric metrics parsed from each contract's prose (premium and headline limit are parsed deterministically from the wording, which is kept as the source). Charts summarise the book; the table below lets you correct any value in place — every change is recorded as a governed, audited decision.</div>
          </details>`;
        if (!contracts.length) {
          return explain + `<div class="card">No contracts ingested yet — recognise the schema first in <a href="#mrc_recognition">Schema Recognition</a>, then contracts flow through and their metrics appear here.</div>`;
        }
        // Single-hue horizontal bars (dataviz: thin marks, rounded ends on the baseline, direct value labels, no legend for one series).
        const hbar = (items, title) => {
          const max = Math.max(1, ...items.map(i => Number(i.v) || 0));
          const rowH = 40, W = 720, labelW = 210, valW = 150, barMax = W - labelW - valW;
          const h = items.length * rowH + 12;
          const rows = items.map((it, i) => {
            const y = i * rowH + 10, len = Math.max(2, (Number(it.v) || 0) / max * barMax);
            return `<text x="0" y="${y + 21}" font-size="12.5" fill="var(--ink)">${escapeHtml(it.label)}</text>`
              + `<rect x="${labelW}" y="${y + 8}" width="${len}" height="18" rx="4" fill="var(--brand)"></rect>`
              + `<text x="${labelW + len + 8}" y="${y + 21}" font-size="12" fill="var(--mut)" font-variant-numeric="tabular-nums">${escapeHtml(it.vl)}</text>`;
          }).join('');
          return `<div class="card"><h2 style="margin-top:0">${escapeHtml(title)}</h2>`
            + `<svg viewBox="0 0 ${W} ${h}" width="100%" role="img" aria-label="${escapeHtml(title)}">${rows}</svg></div>`;
        };
        const ccys = [...new Set(contracts.map(c => c.premium_currency).filter(Boolean))];
        const premiumCharts = ccys.map(cc => hbar(contracts.filter(c => c.premium_currency === cc)
            .map(c => ({label: c.class_of_business, v: c.premium_amount, vl: fmt(c.premium_amount, cc)})), 'Premium by class — ' + cc)).join('');
        const byCcy = d.by_currency || [];
        const opt = (v, cur) => `<option ${cur === v ? 'selected' : ''}>${v}</option>`;
        const editRow = c => `
          <tr>
            <td><input data-mrc-edit data-mrc-id="${escapeAttr(c.mrc_id)}" data-field="class_of_business" aria-label="Class of business" value="${escapeAttr(c.class_of_business || '')}" style="width:100%;padding:5px;border:1px solid var(--line2);border-radius:5px"></td>
            <td><input data-mrc-edit data-mrc-id="${escapeAttr(c.mrc_id)}" data-field="insured_name" aria-label="Insured name" value="${escapeAttr(c.insured_name || '')}" style="width:100%;padding:5px;border:1px solid var(--line2);border-radius:5px"></td>
            <td><input data-mrc-edit data-mrc-id="${escapeAttr(c.mrc_id)}" data-field="broker_name" aria-label="Broker" value="${escapeAttr(c.broker_name || '')}" style="width:100%;padding:5px;border:1px solid var(--line2);border-radius:5px"></td>
            <td class="num"><input data-mrc-edit data-mrc-id="${escapeAttr(c.mrc_id)}" data-field="premium_amount" aria-label="Premium amount" value="${escapeAttr(c.premium_amount || '')}" style="width:120px;padding:5px;text-align:right;border:1px solid var(--line2);border-radius:5px"></td>
            <td><select data-mrc-edit data-mrc-id="${escapeAttr(c.mrc_id)}" data-field="premium_currency" aria-label="Currency" style="padding:5px;border:1px solid var(--line2);border-radius:5px">${['GBP','USD','EUR'].map(v => opt(v, c.premium_currency)).join('')}</select></td>
            <td class="num"><input data-mrc-edit data-mrc-id="${escapeAttr(c.mrc_id)}" data-field="limit_amount" aria-label="Limit amount" value="${escapeAttr(c.limit_amount || '')}" style="width:130px;padding:5px;text-align:right;border:1px solid var(--line2);border-radius:5px"></td>
          </tr>`;
        return explain
          + `<div class="tiles">
               <div class="tile"><div class="k">Contracts</div><div class="v">${t.contracts}</div></div>
               ${byCcy.map(b => `<div class="tile"><div class="k">Premium (${escapeHtml(b.currency)})</div><div class="v">${fmt(b.premium, b.currency)}</div><div class="k">${b.n} contract${b.n > 1 ? 's' : ''}</div></div>`).join('')}
               ${byCcy.map(b => `<div class="tile"><div class="k">Limits (${escapeHtml(b.currency)})</div><div class="v">${fmt(b.limit_amt, b.currency)}</div></div>`).join('')}
             </div>
             <div style="font-size:11px;color:var(--mut);margin:-6px 0 14px">Open-market contracts only (a binding authority's premium is estimated income). Totals are kept per currency — GBP and USD are never added together.</div>`
          + `<div class="grid2">${premiumCharts}</div>`
          + `<div class="card">
               <h2 style="margin-top:0">Extracted metrics — edit in place</h2>
               <div style="font-size:12px;color:var(--mut);margin-bottom:10px">Correct any value and tab out; the change is saved to the projection and recorded as a governed, audited decision.</div>
               <table>
                 <thead><tr><th>Class</th><th>Insured</th><th>Broker</th><th class="num">Premium</th><th>Ccy</th><th class="num">Limit</th></tr></thead>
                 <tbody>${contracts.map(editRow).join('')}</tbody>
               </table>
             </div>
             <script>
               document.querySelectorAll('[data-mrc-edit]').forEach(function(inp){
                 inp.addEventListener('change', async function(){
                   try{
                     await fetchJSON('/api/mrc/update',{method:'POST',body:{mrc_id:inp.getAttribute('data-mrc-id'),field:inp.getAttribute('data-field'),value:inp.value}});
                     toast('Saved '+inp.getAttribute('data-field')+' — recorded & audited');
                     render();
                   }catch(e){ toast('Error: '+e.message); }
                 });
               });
             <\/script>`;
      },

    // Render nav
    function renderNav() {
      const hash = (window.location.hash || '#home').slice(1).split('?')[0];
      const nav = document.getElementById('nav');
      const flow = flowForView(hash);
      if (!flow) {  // landing — no scoped nav
        nav.innerHTML = '';
        return;
      }
      const fl = FLOWS[flow];
      nav.innerHTML = `
        <a href="#home" class="nav-a" style="opacity:.8"><span class="ic">⌂</span><span>All flows</span></a>
        <div style="font-size:11px;font-weight:700;color:#94a3b8;text-transform:uppercase;letter-spacing:.08em;margin:14px 12px 6px">${escapeHtml(fl.short)}</div>
        ${fl.views.filter(item => !item.hidden).map(item => `
          <a href="#${item.id}" class="nav-a ${(hash === item.id || (fl.views.find(v => v.id === hash) || {}).parent === item.id) ? 'active' : ''}">
            <span class="ic">${item.icon}</span>
            <span>${item.label}</span>
          </a>
        `).join('')}
      `;
    }

    // Escape HTML
    function escapeHtml(str) {
      if(!str) return '';
      const div = document.createElement('div');
      div.textContent = str;
      return div.innerHTML;
    }

    function escapeAttr(str) {
      if(!str) return '';
      return str.replace(/&/g,'&amp;').replace(/"/g,'&quot;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
    }

    // Main render
    async function render(quiet) {
      if (window.__mrcPoll) { clearInterval(window.__mrcPoll); window.__mrcPoll = null; }
      renderNav();
      const hash = (window.location.hash || '#home').slice(1).split('?')[0];
      const viewFn = views[hash] || views.home;
      const app = document.getElementById('app');
      // A quiet render (auto-refresh while a step runs) keeps the current page on screen
      // until the new one is ready, so nothing flickers.
      if (!quiet) app.innerHTML = '<div style="position:relative"><span class="spin"></span></div>';
      try {
        const html = await viewFn();
        app.innerHTML = html;
        // Scripts injected via innerHTML do not execute — re-create them so view
        // event handlers actually run.
        app.querySelectorAll('script').forEach(old => {
          const s = document.createElement('script');
          s.textContent = old.textContent;
          old.replaceWith(s);
        });
      } catch(e) {
        app.innerHTML = `<div class="error-banner">Error loading view: ${escapeHtml(e.message)}</div>`;
      }
    }

    // Mode toggle
    document.getElementById('modeBtn')?.addEventListener('click', () => {
      MODE = MODE === 'cached' ? 'live' : 'cached';
      const btn = document.getElementById('modeBtn');
      btn.className = 'pill ' + MODE;
      btn.textContent = MODE.toUpperCase();
    });

    // Router
    window.addEventListener('hashchange', () => render());
    render();

    // Footer disclaimer
    const footer = document.createElement('footer');
    footer.style.cssText = 'padding:32px;text-align:center;font-size:11px;color:var(--mut);border-top:1px solid var(--line);margin-top:60px';
    footer.innerHTML = `<strong>About this demo.</strong> Bricksurance is a fictional insurance group and all coverholders, carriers and figures here are synthetic. The MRC tenant uses real, publicly-known market names for realism, but all insureds and figures are invented. The method is illustrative. Every screen reads a real governed Unity Catalog table, view, or function.`;
    document.querySelector('.content')?.parentElement?.appendChild(footer);
  </script>
</body>
</html>
